  - {key: "mom_cafe", name: "맘카페·당근(아동미술)", fit: "high", entry_cost_won: 0, primary_metric: "동네 학부모 노출", roi_note: "무료. 아동·취미미술은 동네 학부모 입소문이 핵심", confidence: "hypothesis"}
  - {key: "art_exam_community", name: "미술입시 커뮤니티·네이버카페(입시미술)", fit: "high", primary_metric: "입시생 정보 탐색", roi_note: "입시미술은 전문 커뮤니티·합격 실적 노출이 핵심", confidence: "hypothesis"}
  - {key: "blog", name: "네이버 블로그(합격 후기·과정)", fit: "medium", primary_metric: "검색 노출·신뢰", roi_note: "합격 후기·수업 과정 기록", confidence: "hypothesis"}
  - {key: "kakao_alimtalk", name: "카카오 알림톡", fit: "medium", per_unit_cost_won: 9, primary_metric: "도달 95%+", roi_note: "건당 8~9원. 전시회·수업 안내", confidence: "measured", source: "카카오 비즈메시지"}
  - {key: "baemin_musinsa", name: "배민·무신사 등", fit: "avoid", applicable: false, roi_note: "해당 없음", confidence: "measured"}

