    - "(입시반) 합격생 포트폴리오를 동의받아 게시하면 신입생 문의가 늘어요"
  do: ["아이들 작품·수업 과정 사진 정기 인스타 업로드", "전시회·공모전 참가로 학부모 만족·재등록 유도", "(입시) 합격 실적·포트폴리오 노출"]
