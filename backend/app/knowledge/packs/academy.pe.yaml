  - {key: "mom_cafe_daangn", name: "맘카페·당근", fit: "medium", entry_cost_won: 0, primary_metric: "동네 학부모 노출·후기", roi_note: "무료", confidence: "hypothesis"}
  - {key: "naver_place", name: "네이버 플레이스", fit: "medium", entry_cost_won: 0, primary_metric: "검색·길찾기·후기", roi_note: "무료 등록", confidence: "measured", source: "네이버"}
  - {key: "kakao_alimtalk", name: "카카오 알림톡(승급·발표회·재등록 안내)", fit: "high", per_unit_cost_won: 9, primary_metric: "도달 95%+", roi_note: "건당 8~9원. 행사 안내·재등록 리마인드가 이탈 방어에 직결", confidence: "measured", source: "카카오 비즈메시지"}
  - {key: "baemin_musinsa", name: "배민·무신사 등", fit: "avoid", applicable: false, roi_note: "해당 없음", confidence: "measured"}

