prompt_block: |-
  ## 업종 분기 가이드 — 한식 일반 (백반·가정식·국밥·탕·찌개 — 회전형)
  - Hero KPI: 점심 회전율(테이블당 2~3회전) + 객수. 단골 비중(직장인 반복 방문). 객단가 인상 여력은 작아 "양·속도·일관성" 게임
  - 객단가: 점심 8,000~12,000원, 저녁 10,000~16,000원 (외식 평균 14,310원보다 낮은 편)
  - 운영 리듬: 평일 점심 11:30~13:00 압도적 / 직장상권형은 주말 매출 급감 / 겨울 탕·찌개·해장국 수요↑ / 명절 연휴 공백
  - Top 채널: 네이버 플레이스(상호+동네+"백반/국밥" 키워드, 점심 검색 유입)·카카오맵 > 단골 관리(쿠폰·적립) > 메뉴판·세트·가격표 노출. 배달·인스타 효과 낮음
  - 손실 프레임: "점심 검색 노출(네이버 플레이스) 미정비", "단골 적립·쿠폰 없음", "세트 메뉴·가격표 미노출", "주말 매출 공백 무대응"
  - 위험 신호: 점심 회전율 < 1.5회 / 객단가 < 8,000원 / 식재료비율 > 42% / 영업이익률 < 6%
  - 카피 예: "네이버 플레이스에 '○○동 백반'으로 검색되게 메뉴·가격을 정비하세요 — 점심 손님은 거기서 찾아옵니다"
  - 금지: "인스타 비주얼에 투자하세요"(점심 회전형엔 효과 작음), "배달 비중 늘리세요"(홀 회전형엔 무관)

hero_kpis:
  - {key: "lunch_turnover", label: "점심 회전율", unit: "회", good: "≥ 2.5", warn: "1.5–2.4", danger: "< 1.5", confidence: "estimated", source: "업계 추정 — 회전형 한식 점심 2~3회전"}
  - {key: "avg_ticket", label: "객단가", unit: "원", good: "≥ 10,000", warn: "8,000–9,999", danger: "< 8,000", confidence: "estimated", source: "추정 — 외식 평균 14,310원(2024)보다 낮음"}
  - {key: "loyal_ratio", label: "단골 비중", unit: "%", good: "≥ 50", warn: "30–49", danger: "< 30", confidence: "estimated", source: "업계 추정 — 직장인 반복 방문"}
  - {key: "food_cost_ratio", label: "식재료비 비율", unit: "% 매출", good: "≤ 38", warn: "39–42", danger: "> 42", confidence: "estimated", source: "농식품부 외식업체 경영실태조사 2024 — 외식 평균 40.7%"}
  - {key: "operating_margin", label: "영업이익률", unit: "%", good: "≥ 10", warn: "6–9", danger: "< 6", confidence: "estimated", source: "외식업체 평균 8.7% (2024)"}

