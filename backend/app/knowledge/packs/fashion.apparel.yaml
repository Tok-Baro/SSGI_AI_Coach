# fashion.apparel — 의류 매장 (오프라인 + 온라인 쇼핑몰)
# 핵심: 오프라인 동네 의류점은 어려운 구조 → 인스타·무신사·지그재그·에이블리·스마트스토어 병행이 필수.
# 출처: 패션 상장사 재무(영업이익률 7.6~8.5%, 2024 상반기) + 무신사/지그재그/에이블리 수수료(~12.2%/~4.5%/27·18%) + sme-coach. (영세 의류 소매 단위 통계 미확인 — 추정.)
id: fashion.apparel
name: 의류 매장
group: fashion
status: active
version: 1
reviewed_date: 2026-05-11
sources:
  - label: 패션 상장사 재무공시(2024 상반기) + 무신사·지그재그·에이블리 수수료 + sme-coach 플레이북
    year: 2024

match:
  priority: 38   # fashion(40) 보다 먼저
  keywords: [의류매장, 옷가게, 패션의류, 의류쇼핑몰, 여성의류, 남성의류, 캐주얼의류, 아동복, 유아복, 한복, 스포츠웨어, 아웃도어매장, 빈티지의류, 보세옷가게, 의류편집샵, 의류]
  ksic_codes: ["47711"]   # 의복 소매업

prompt_block: |-
  ## 업종 분기 가이드 — 의류 매장 (오프라인 + 온라인 쇼핑몰)
  ※ 동네 오프라인 의류점만으론 매출 한계 — 온라인(인스타·플랫폼·스마트스토어) 병행을 전제로 답하세요.
  - Hero KPI: ① **재구매율(단골 1:1 신상 알림 — 25~40%)** ② 시즌 소진율(판매율 — 봄·가을 신상 70%+ 소진해야 함, 재고 = 현금) ③ 재고회전율(연 4회+) ④ 인스타 팔로워·노출(온라인 유입 직결) ⑤ 영업이익률(마진 40~60%지만 재고·임차료가 갉아먹음)
  - 객단가: 2만~15만(품목·브랜드 따라). 마진율 40~60%. 영업이익률 ~8%(패션 상장사 7.6~8.5%, 영세는 더 낮음). (추정)
  - 운영 리듬: 봄·가을 시즌 신상(3월/9월)이 매출 핵심 / 연말 +25% / 시즌 끝물 세일·이월 처리(재고 회전) / 신상 입고일 단골 알림이 즉시 매출
  - Top 채널: ① **인스타그램(코디·모델 컷 — 의류는 비주얼 채널 핵심) + 1~2개 플랫폼 입점(무신사 브랜드 ~12.2% / 지그재그 ~4.5% / 에이블리 27·18% / 스마트스토어)** ② 네이버 톡톡·카카오 친구톡 1:1(단골 신상 알림 — 전환율 30~50%) ③ 네이버 플레이스(오프라인 매장) ④ 당근(이월·중고 연계). 배달앱 무관
  - 손실 프레임: "온라인(인스타·플랫폼·스마트스토어) 미운영 — 오프라인만으론 한계", "단골 1:1 신상 알림 없음(즉시 매출 기회 놓침)", "시즌 끝물 재고 처리 안 됨(현금이 묶임)", "인스타 코디·모델 컷 빈약(온라인 유입 없음)", "시그니처 아이템 부재(브랜드 정체성 없음)"
  - 위험 신호: 재구매율 < 20% / 시즌 소진율 < 50%(이월 재고 누적) / 재고회전율 < 2회 / 인스타 팔로워 빈약 / 평당 매출 < 100만
  - 카피 예: "신상 입고일 단골 30명에게 카톡 1:1로 보내면 평균 5건 즉시 주문이 들어와요", "베스트 아이템 1~2개를 정해 인스타 메인에 고정하세요 — 브랜드 정체성이 생깁니다. 시즌 끝물 재고는 미루지 말고 묶음·세일로 현금화하세요"
  - 금지: "배민 입점"(의류는 배달앱 무관), "모든 채널 동시 시작"(1~2개부터), 오프라인만으로 충분하다고 답하기

hero_kpis:
  - {key: "repurchase_rate", label: "재구매율(단골)", unit: "%", good: "≥ 35", warn: "20–34", danger: "< 20", confidence: "estimated", source: "업계 통설 — 첫 방문→재구매 25~40%"}
  - {key: "sell_through_rate", label: "시즌 소진율(판매율)", unit: "%", good: "≥ 70", warn: "50–69", danger: "< 50", confidence: "estimated", source: "패션업계 통설 — 재고 = 현금"}
  - {key: "inventory_turnover", label: "재고회전율", unit: "회/년", good: "≥ 4", warn: "2–3.9", danger: "< 2", confidence: "estimated", source: "업계 통설"}
  - {key: "operating_margin", label: "영업이익률", unit: "%", good: "≥ 8", warn: "4–7", danger: "< 4", confidence: "estimated", source: "패션 상장사 7.6~8.5%(2024 상반기) — 영세는 더 낮게 추정"}
  - {key: "instagram_followers", label: "인스타 팔로워", unit: "명", good: "≥ 1,000", danger: "< 1,000", confidence: "hypothesis", source: "팔로워↔매출 대략 추정"}

kpi_thresholds:
  재구매율_위험: "< 20%"
  시즌_소진율_위험: "< 50%"
  재고회전율_위험: "< 2회/년"

subsidy_tags: [digital, marketing, store_renovation]   # 온라인 입점·e커머스·라이브커머스 / 홍보·판로 / 점포환경개선

channels:
  - {key: "instagram", name: "인스타그램(코디·모델 컷)", fit: "high", monthly_budget_min_won: 50000, monthly_budget_max_won: 500000, primary_metric: "도달·저장·DM·온라인 유입", roi_note: "의류는 비주얼 채널 핵심. CPC 100~500원·CPM 5천~1.5만원 입찰제. ROAS는 매장 데이터로만 산출 — 단정 금지", confidence: "hypothesis", source: "인스타 광고 단가 한국 기준"}
  - {key: "platform", name: "패션 플랫폼 입점(무신사·지그재그·에이블리·스마트스토어)", fit: "high", fee_pct: 12.2, primary_metric: "거래액·노출", roi_note: "무신사 실질 ~12.2%(브랜드만) / 지그재그 ~4.5% / 에이블리 패션·뷰티 27%(자체셀러 3% 모델) / 스마트스토어 ~2~4%. 1~2개부터", confidence: "measured", source: "각 플랫폼 수수료"}
  - {key: "kakao_naver_talk", name: "카카오 친구톡·네이버 톡톡 1:1(단골 신상 알림)", fit: "high", per_unit_cost_won: 15, primary_metric: "신상 알림→즉시 주문", roi_note: "텍스트 15원/이미지 18원/건(VAT 별도). 신상 입고일 1:1 발송 — 전환율 30~50%", confidence: "measured", source: "카카오 비즈메시지 단가"}
  - {key: "naver_place", name: "네이버 플레이스(오프라인 매장)", fit: "medium", entry_cost_won: 0, primary_metric: "검색·길찾기", roi_note: "무료 등록 — 오프라인 매장이면", confidence: "measured", source: "네이버"}
  - {key: "daangn", name: "당근(이월·중고 연계)", fit: "low", entry_cost_won: 0, primary_metric: "동네 노출", roi_note: "무료. 이월·샘플 중고 처분 연계 정도", confidence: "hypothesis"}
  - {key: "baemin", name: "배민(배달앱)", fit: "avoid", applicable: false, roi_note: "해당 없음 (의류는 배달앱 무관)", confidence: "measured"}

copy_tone:
  vocab: ["신상 입고", "단골 1:1 알림", "시즌 소진율", "시그니처 아이템", "코디 컷", "재고 = 현금"]
  loss_frames: ["온라인(인스타·플랫폼·스마트스토어) 미운영", "단골 1:1 신상 알림 없음", "시즌 끝물 재고 처리 안 됨(현금 묶임)", "인스타 코디·모델 컷 빈약", "시그니처 아이템 부재"]
  examples:
    - "신상 입고일 단골 30명에게 카톡 1:1로 보내면 평균 5건 즉시 주문이 들어와요"
    - "베스트 아이템 1~2개를 인스타 메인에 고정하세요 — 브랜드 정체성이 생깁니다. 시즌 끝물 재고는 미루지 말고 묶음·세일로 현금화하세요"
  do: ["인스타 코디·모델 컷 정기 업로드 + 1~2개 플랫폼 입점", "단골 1:1 신상 알림(카톡·톡톡)", "시즌 끝물 재고 묶음·세일로 회전"]
  dont: ["배민 입점 (의류는 배달앱 무관)", "모든 채널 동시 시작 / 오프라인만으로 충분하다고 답하기"]
