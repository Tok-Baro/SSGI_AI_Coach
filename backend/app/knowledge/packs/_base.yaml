# _base — 모든 업종 팩이 상속하는 공통 기본값.
# (이 파일 자체는 IndustryPack 으로 만들어지지 않음. 머지 시 가장 아래 깔리는 디폴트.)
id: _base
name: 공통 기본값

# marketing_audit 5 차원 — 기본 배율 1.0 (업종 팩이 차원별로 덮어씀)
