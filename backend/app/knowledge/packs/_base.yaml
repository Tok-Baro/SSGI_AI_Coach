  경쟁 포지셔닝: 0.15
  코치 활용도: 0.10
  위험도 추세: 0.10

# risk_score_engine 7 시그널 — 기본 배율 1.0 (업종 팩이 시그널별로 덮어씀, 합 제약 없음)
risk_signal_weights:
  sales_trend: 1.0
  competition: 1.0
  commercial_vitality: 1.0
  subsidy_urgency: 1.0
  population_trend: 1.0
  action_engagement: 1.0
  business_maturity: 1.0

# 업종별 위험 임계값 — 기본은 비어 있음
kpi_thresholds: {}

