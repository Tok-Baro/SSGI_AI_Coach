# 핵심: 의류와 유사하나 사이즈·재고 관리 + 정품 신뢰(특히 운동화 리셀·명품 가방)가 추가 변수.
# 출처: 패션 소매 업계 통상치 + 무신사·KREAM(운동화) + sme-coach. (신발·잡화 소매 단위 통계 미확인 — 추정.)
