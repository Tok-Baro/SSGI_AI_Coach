  - {key: "platform", name: "패션 플랫폼 입점(무신사·지그재그·에이블리·스마트스토어) + (운동화) KREAM 등", fit: "high", fee_pct: 12.2, primary_metric: "거래액·노출·정품 신뢰", roi_note: "무신사 ~12.2%(브랜드만)/지그재그 ~4.5%/에이블리 27·18%/스마트스토어 ~2~4%. 운동화는 KREAM 등 검수 플랫폼이 정품 신뢰·노출에 유효. 1~2개부터", confidence: "measured", source: "각 플랫폼 수수료"}
  - {key: "kakao_naver_talk", name: "카카오 친구톡·네이버 톡톡 1:1(단골 신상·한정판 알림)", fit: "high", per_unit_cost_won: 15, primary_metric: "신상·한정판 알림→즉시 주문", roi_note: "텍스트 15원/이미지 18원/건(VAT 별도). 입고일 1:1 발송", confidence: "measured", source: "카카오 비즈메시지 단가"}
  - {key: "naver_place", name: "네이버 플레이스(오프라인 매장)", fit: "medium", entry_cost_won: 0, primary_metric: "검색·길찾기", roi_note: "무료 등록 — 오프라인 매장이면", confidence: "measured", source: "네이버"}
