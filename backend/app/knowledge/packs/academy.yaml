  - {key: "daangn_ad", name: "당근 광고(CPC)", fit: "high", monthly_budget_min_won: 300000, monthly_budget_max_won: 1000000, per_unit_cost_won: 100, primary_metric: "지역 클릭→상담", roi_note: "클릭 최소 100원 입찰. 지역 한정 학원에 적합", confidence: "hypothesis", source: "당근 광고"}
  - {key: "naver_place", name: "네이버 플레이스(+광고)", fit: "high", entry_cost_won: 0, primary_metric: "검색·길찾기·후기", roi_note: "학원명·동네 키워드 검색. 무료 등록 + CPC 광고 옵션", confidence: "hypothesis", source: "네이버"}
  - {key: "flyer", name: "전단지(학원가 우편함)", fit: "high", monthly_budget_min_won: 50000, monthly_budget_max_won: 300000, primary_metric: "배포→문의", roi_note: "신학기·방학 특강 시즌. 반응률 데이터는 미확인(1% 미만 가설)", confidence: "hypothesis", source: "전단지 인쇄 단가"}
  - {key: "kakao_alimtalk", name: "카카오 알림톡(수강·결석·재등록 안내)", fit: "medium", per_unit_cost_won: 9, primary_metric: "도달률 95%+", roi_note: "건당 8~9원(VAT 별도). 재등록 시즌 안내에 강함", confidence: "measured", source: "카카오 비즈메시지"}
  - {key: "instagram", name: "인스타그램", fit: "medium", primary_metric: "브랜딩·후기 노출", roi_note: "예체능 학원은 효과 큼, 입시·교과는 보통", confidence: "hypothesis"}
