# academy — 학원/교습소 (P1: 기존 service 슬러그에서 독립).
#   학원은 객단가·리텐션이 과목(입시/예체능/교과)·지역 편차가 극단적 → 별도 팩.
#   세부 leaf(academy.exam / academy.arts / academy.language) 는 추후 분리 예정.
# 콘텐츠 출처: 소상공인 KPI 벤치마크 리서치 (BC카드 신금융연구소 학원매출 분석 2023 등) + sme-coach 플레이북.
# 지원금 태그(P2): education / digital / store_renovation — 교육서비스업, 정책자금 제외업종 아님.
id: academy
name: 학원·교습소
status: active
version: 1
reviewed_date: 2026-05-11
sources:
  - label: BC카드 신금융연구소 학원매출 분석 (2023) + 소상공인 업종 KPI 벤치마크 리서치
    year: 2023
  - label: sme-coach 업종 플레이북
    year: 2026

match:
  priority: 45   # service(50) 보다 먼저 검사 — "○○학원" 이 service 로 빠지지 않게
  keywords: [학원, 교습소, 보습, 입시, 어학원, 공부방, 과외, 영어학원, 수학학원, 미술학원, 음악학원, 피아노학원, 코딩학원, 논술, 태권도장, 발레학원, 입시학원, 보습학원]
  ksic_codes: ["85"]   # 교육서비스업 (85501 일반교과 / 85502 외국어 / 85503 컴퓨터 / 85504 기타교습 …)

prompt_block: |-
  ## 업종 분기 가이드 — 학원/교습소
  - Hero KPI: 재등록률(80%+) + 정원 충족률(70%+) + 학생 1인당 월 수강료(객단가, 과목·지역 편차 큼)
  - Top 채널: 당근 비즈프로필·당근 광고(동네 학부모) + 네이버 플레이스(필수) > 전단지(학원가 우편함) > 알림톡(수강·결석 안내) > 인스타
  - 운영 리듬: 평일 방과후 15~21시 + 주말 보강, 학기 시작(3월·9월)·방학 특강 시즌
  - 손실 프레임: "재등록 시즌 이탈", "학부모 후기·입소문 부재", "정원 미달 빈 시간대"
  - 위험 신호: 재등록률 < 60% / 정원 충족률 < 50% / 강사료 비율 > 55% / 영업이익률 < 6%
  - 카피 예: "재등록 안내 알림톡 한 번 보내면 지난달 이탈 8명 중 평균 3명이 다시 등록해요"
  - 금지: "배달앱 광고"·"무신사 입점" 같은 무관 채널, "객단가 단정"(과목·학년별 편차가 커서 추정으로만)

audit_weights:
  positioning: 1.0
  message_fit: 1.1   # 학부모 타깃 메시지 적합도 중요
  timing: 0.9
  social_proof: 1.2  # 후기·입소문 의존 큼
  friction: 1.1      # 상담·등록 마찰

report_weights:
  매출 트렌드: 0.24
  보조금 활용: 0.16
  유동인구 활용: 0.12   # 목적성 방문 — 유동인구 영향 작음
  경쟁 포지셔닝: 0.24   # 학군 내 학원 경쟁 치열
  코치 활용도: 0.10
  위험도 추세: 0.14

risk_signal_weights:   # 학군 내 학원 경쟁 치열 / 목적성 방문이라 유동인구 영향 작음
  competition: 1.2
  population_trend: 0.8

kpi_thresholds:
  재등록률_위험: "< 60%"
  정원_충족률_위험: "< 50%"
  강사료_비율_위험: "> 55%"
  영업이익률_위험: "< 6%"

subsidy_tags: [education, digital, store_renovation]   # 교육서비스업 — 정책자금 제외업종 아님

# 공공데이터 해석 주의 — 학원은 월 정기결제·분기 선결제 업종이라 카드매출 패턴이 영업활동량과 다름.
data_caveats:
  - "서울 상권분석 추정매출은 카드 승인일 기준 → 학원은 등록일·자동결제일(월초·주말 등)에 매출이 스파이크로 찍힘. '화요일 매출 낮음 = 화요일 약함'처럼 요일·일자별 매출 패턴을 영업활동으로 곧이곧대로 해석하면 안 됨."
  - "학기 시작월(3월)·방학 시작월(7·12월)에 결제가 폭증 → 월별 매출도 운영 규모가 아니라 결제 타이밍을 반영. 'OO월 매출 급증'을 그달 손님이 늘었다고 단정 X."
  - "CMS 자동이체 비중이 높은 학원은 카드매출 자체가 과소집계될 수 있음 — 추정매출은 실매출 하한선으로만."
  - "추정매출은 상권 내 동종업종 추정치 → 사장님 가게 실제 매출이 아니라 '같은 동네 비슷한 학원들 평균'으로 읽어야 함."

hero_kpis:
  - {key: "reenroll_rate", label: "재등록률", unit: "%", good: "≥ 80", warn: "60–79", danger: "< 60", confidence: "estimated", source: "업계 통설 (BC카드 신금융연구소 학원매출 분석 참고)"}
  - {key: "capacity_fill", label: "정원 충족률", unit: "%", good: "≥ 70", warn: "50–69", danger: "< 50", confidence: "estimated", source: "추정"}
  - {key: "instructor_cost_ratio", label: "강사료 비율", unit: "% 매출", good: "≤ 45", warn: "46–55", danger: "> 55", confidence: "estimated", source: "업계 통설 — 강사 인센티브 구조"}
  - {key: "operating_margin", label: "영업이익률", unit: "%", good: "≥ 12", warn: "6–11", danger: "< 6", confidence: "estimated", source: "대형 입시학원 9.8~16.2%(2023, BC카드) — 영세 교습소는 더 낮게 추정"}

channels:
