copy_tone:
  vocab: ["재등록", "정원", "학부모", "신학기 특강", "원생"]
  loss_frames: ["재등록 시즌 이탈", "학부모 후기·입소문 부재", "정원 미달 빈 시간대"]
  examples:
    - "재등록 안내 알림톡 한 번 보내면 지난달 이탈 8명 중 평균 3명이 다시 등록해요"
    - "신학기엔 문의가 평소보다 많아요. 당근 비즈프로필부터 정비하세요"
  do: ["당근 비즈프로필·네이버 플레이스 후기 관리", "신학기/방학 특강 전단지", "재등록 시즌 알림톡"]
