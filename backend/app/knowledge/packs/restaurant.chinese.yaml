prompt_block: |-
  ## 업종 분기 가이드 — 중식 (동네 중국집 / 마라탕 / 양꼬치·중화요리주점)
  - 동네 중국집(짜장·짬뽕·탕수육): 점심 7,000~10,000원·저녁 12,000~20,000원. Hero KPI = **배달·포장 비중**(세트) + 점심 회전. 원가율 30~38%지만 배달수수료 잠식
  - 마라탕: 1인 9,000~14,000원(토핑 종량). Hero KPI = 객수·테이크아웃 회전. 10대~20대 방과후·저녁 수요
  - 양꼬치·중화요리주점: 1인 18,000~30,000원(주류 포함). Hero KPI = 저녁/야간 매출·주류 마진·단체. 금토 야간
  - 운영 리듬: 중국집은 졸업·입학·이사철(2~3월) 단체배달 피크 / 평일 점심·주말 가족배달 / 마라탕은 방과후·저녁 / 양꼬치는 금토 야간
  - Top 채널: 동네 중국집 → **배민/요기요(울트라콜) 1순위 + 네이버 플레이스** / 마라탕 → 인스타·당근·플레이스(젊은층) / 양꼬치·중화요리주점 → 네이버 플레이스·인스타(회식·모임)·카카오맵
  - 손실 프레임: "(중국집) 배달앱 노출·세트 구성 미흡", "(중국집) 배달수수료에 잠식되는 마진(공공배달앱 미활용)", "(마라탕) 인스타·당근 동네 노출 부재", "(양꼬치) 회식·모임 검색 노출 미정비"
  - 위험 신호: (중국집) 배달수수료+광고비 비율 > 25% / 점심 회전율 < 1.5회 / (마라탕) 평일 객수 저조 / (양꼬치) 야간 매출 비중 < 60%
  - 카피 예: "(중국집) 짜장·짬뽕·탕수육 세트 1~2개만 만들어 배민에 올려도 객단가가 올라가요. 공공배달앱(땡겨요 등)은 수수료 2%대니 같이 쓰세요", "(마라탕) 신메뉴·매운맛 단계 사진을 인스타·당근에 올리면 동네 10·20대가 찾아옵니다"
  - 금지: 동네 중국집/마라탕/양꼬치 구분 없이 일반론, "캐치테이블 예약"(동네 중국집엔 무관)

