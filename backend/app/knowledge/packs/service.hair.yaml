  vocab: ["재방문", "예약 비율", "VIP 등급", "BEFORE/AFTER", "워크인", "디자이너 포트폴리오"]
  loss_frames: ["네이버 예약 미도입(워크인 손실·노쇼·빈 시간대 안 보임)", "후기 별점 < 4.7(검색 노출 하락)", "재방문 관리·VIP 등급제 없음", "디자이너별 인스타 포트폴리오 부재"]
  examples:
