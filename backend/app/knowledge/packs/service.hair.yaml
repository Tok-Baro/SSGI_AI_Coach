    - "단골 5회 오시면 시술 10% 할인 — VIP 등급제 만드시면 재방문율 +15% 통계가 있어요"
  do: ["네이버 예약 도입(워크인 손실 방지)", "BEFORE/AFTER·디자이너 포트폴리오 인스타", "VIP 등급제(5회→10% 등) + 친구 추천 보상"]
