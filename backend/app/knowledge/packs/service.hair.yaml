  - {key: "naver_place", name: "네이버 플레이스(등록·광고)", fit: "high", entry_cost_won: 0, primary_metric: "검색·길찾기·후기", roi_note: "무료 등록 + CPC 광고. 별점 4.7+ 가 노출 자격", confidence: "measured", source: "네이버"}
  - {key: "instagram", name: "인스타그램(BEFORE/AFTER·디자이너 포트폴리오)", fit: "high", monthly_budget_min_won: 0, monthly_budget_max_won: 500000, primary_metric: "도달·DM·예약 유입", roi_note: "시술 결과 사진·디자이너별 포트폴리오가 강력. 광고 일 1,000원+", confidence: "hypothesis"}
  - {key: "kakao_friendtalk", name: "카카오 친구톡(재방문·VIP 알림)", fit: "medium", per_unit_cost_won: 15, primary_metric: "재방문·VIP 안내", roi_note: "텍스트 15원/이미지 18원/건(VAT 별도). VIP 등급·재방문 쿠폰", confidence: "measured", source: "카카오 비즈메시지"}
  - {key: "referral_reward", name: "친구 추천 보상", fit: "medium", primary_metric: "신규 유입·재방문", roi_note: "양쪽 할인(호혜성). 단골이 데려오는 신규가 가장 충성도 높음", confidence: "hypothesis"}
  - {key: "baemin_musinsa", name: "배민·무신사 등", fit: "avoid", applicable: false, roi_note: "해당 없음", confidence: "measured"}

