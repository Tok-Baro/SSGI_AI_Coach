# service.hair — 미용실 (헤어 — 컷·펌·염색)
# 출처: KB 자영업 분석 보고서(미용실) + 이/미용 산업 평균 영업이익률 ~26%(이용업은 더 높음) + 네이버 예약 수수료(미용 ~3.19%) + sme-coach. (소형 미용실 단위 통계 미확인 — 추정.)
id: service.hair
name: 미용실 (헤어)
group: service
status: active
version: 1
reviewed_date: 2026-05-11
sources:
  - label: KB 자영업 분석 보고서(미용실) + 이/미용 산업 평균 데이터 + 네이버 예약 수수료 + sme-coach 플레이북
    year: 2024

match:
  priority: 35   # service(50) 보다 먼저
  keywords: [미용실, 헤어샵, 헤어살롱, 미용원, 헤어, 헤어디자인, 두발미용, 헤어컬러, 펌전문, 남성미용실, 바버샵, 이발소, 이용원, 미용]
  ksic_codes: ["96111", "96112"]   # 두발 미용업 / 이용업

prompt_block: |-
  ## 업종 분기 가이드 — 미용실 (헤어 — 컷·펌·염색)
  - Hero KPI: ① **재방문율(단골 비중 — 미용실 매출의 60~80%)** ② 예약 비율(워크인 손실 방지) ③ 시술 단가(펌·염색 부착률) ④ 디자이너 인센티브(인건비) 비율 ⑤ 후기 별점(네이버 플레이스 노출 직결)
  - 객단가: 컷 1.5~3만, 펌·염색 5~15만+, 클리닉·시술 추가 시 더 큼 (추정). 이/미용 산업 평균 영업이익률 ~26%(1인 매장은 사업주 인건비 인출 보정 필요)
  - 운영 리듬: 금·토 주말 외출 준비 강세 / 결혼·명절 시즌 / 졸업·입학(2~3월)·연말 / 학년 진급기·이사철에 단골 이탈
  - Top 채널: ① **네이버 예약(미용실은 사실상 필수 — 워크인 손실 방지·노쇼 감소, 수수료 ~3.19%) + 네이버 플레이스(별점 4.7+ 가 노출 자격)** ② 인스타그램(시술 BEFORE/AFTER·디자이너별 포트폴리오) ③ 카카오 친구톡(재방문 알림·VIP 등급) ④ 친구 추천 보상(양쪽 할인). 배달·블로그 효과 낮음
  - 손실 프레임: "네이버 예약 미도입(워크인 손실·노쇼 방치·빈 시간대 안 보임)", "후기 별점 < 4.7(검색 노출 하락)", "재방문 관리·VIP 등급제 없음(단골 락인 부재)", "디자이너별 인스타 포트폴리오 부재"
  - 위험 신호: 재방문율 < 50% / 예약 비율 < 60% / 후기 별점 < 4.5 / 디자이너 인센티브 비율 > 45%(인건비 압박) / 영업이익률 < 15%
  - 카피 예: "네이버 예약 하나만 도입해도 노쇼가 줄고 빈 시간대가 한눈에 보여요 — 그 빈 시간에 단골 알림을 돌리세요", "단골 5회 오시면 시술 10% 할인 — VIP 등급제 만드시면 재방문율 +15% 통계가 있어요"
  - 금지: "배달앱 광고", "점심 회전율"(미용실은 예약형 — 회전율 개념과 무관), 광고 규제 위반 소지 표현(과장 효과 단정)

hero_kpis:
  - {key: "revisit_rate", label: "재방문율(단골 비중)", unit: "%", good: "≥ 70", warn: "50–69", danger: "< 50", confidence: "estimated", source: "업계 통설 — 미용실 매출의 60~80%가 단골"}
  - {key: "booking_ratio", label: "예약 비율", unit: "%", good: "≥ 60", warn: "40–59", danger: "< 40", confidence: "estimated", source: "업계 추정 — 워크인 의존 시 비효율"}
  - {key: "review_rating", label: "네이버 후기 별점", unit: "점", good: "≥ 4.7", warn: "4.5–4.69", danger: "< 4.5", confidence: "estimated", source: "업계 통설 — 별점이 노출 순위에 직접"}
  - {key: "stylist_cost_ratio", label: "디자이너 인센티브(인건비) 비율", unit: "% 매출", good: "≤ 40", warn: "41–45", danger: "> 45", confidence: "estimated", source: "업계 통설"}
  - {key: "operating_margin", label: "영업이익률", unit: "%", good: "≥ 26", warn: "15–25", danger: "< 15", confidence: "estimated", source: "이/미용 산업 평균 ~26% — 1인 매장은 인건비 인출 보정"}

kpi_thresholds:
  재방문율_위험: "< 50%"
  예약_비율_위험: "< 60%"
  별점_위험: "< 4.5"
  디자이너_인센티브_위험: "> 45%"

risk_signal_weights:   # 예약형·단골 의존 → 사회적 증거(후기)·코치 활용도(예약·재방문 관리) 비중↑ / 점심 유동인구 영향 작음
  action_engagement: 1.1

subsidy_tags: [store_renovation, digital, education]   # 인테리어 개선·예약시스템(POS)·종사자 교육·위생

