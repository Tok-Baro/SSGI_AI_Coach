prompt_block: |-
  ## 업종 분기 가이드 — 안경원·시계방·금은방·주얼리
  ※ 안경원(검안·렌즈·재방문 주기형)과 시계방·금은방(고단가·예물·수리형)이 서로 다름 — 사장님 가게가 어느 쪽인지 확인하고 답하세요.
  - 안경원: 객단가 10~30만+(프레임+렌즈), Hero KPI = **재방문 주기(시력 변화·렌즈 교체 1~2년 주기)·검안 신뢰·렌즈 업셀(누진·기능성)·콘택트 정기 구매**. 검안 예약 운영
  - 시계방·금은방·주얼리: 객단가 매우 큼(수십만~수백만+, 예물·명품 시계), Hero KPI = **예물 시즌(결혼) 매출·수리/세팅 서비스·정품·감정 신뢰·고객 1:1 관리**. 흔치 않은 고관여 구매라 신뢰가 전부
  - 운영 리듬: 안경원 — 신학기(시력검사)·연말 / 시계방·금은방 — 봄·가을 결혼 시즌(예물)·졸업·기념일·명절(돌반지·예물)·금값 시세
  - Top 채널: ① **네이버 플레이스(검색·후기·길찾기 — 안경/예물 모두 검색 비중 큼) + 당근 비즈프로필(동네)** ② 인스타그램(프레임·주얼리·예물 비주얼) ③ (안경) 검안 예약·콘택트 정기배송 / (예물) 1:1 상담 예약·후기 ④ 카카오 채널(렌즈 교체 주기·이벤트). 배달앱 무관. 가격·정품 표기 정확히
  - 손실 프레임: "(안경) 렌즈 교체 주기 알림 없음(1~2년 지나면 다른 곳 감)", "(안경) 누진·기능성 렌즈 업셀 동선 부재(객단가 낮음)", "(예물) 결혼 시즌 마케팅·1:1 상담 무대응", "정품·감정 신뢰 장치 부재(고관여 구매인데)", "네이버 플레이스 후기·사진 미관리"
  - 위험 신호: (안경) 재방문율 낮음 / 렌즈 업셀 비중 낮음(단순 프레임만) / (예물) 결혼 시즌 매출 스파이크 없음 / 후기 별점 < 4.5 / 객단가 정체
  - 카피 예: "(안경) 마지막 검안 1~2년 차 단골에게 '시력 점검 받아보세요' 카톡을 보내세요 — 안경원은 교체 주기 관리가 재방문의 전부예요. 콘택트 단골은 정기배송으로 락인하세요", "(예물) 결혼 시즌 두세 달 전부터 예물 상담 예약을 받고, 커플 후기·세팅 과정을 인스타·플레이스에 올리세요 — 예물은 신뢰가 곧 계약입니다"
  - 금지: 안경/시계·금은방 구분 없이 일반론, "배민 입점"(무관), 정품·감정 관련 과장·허위 표시

