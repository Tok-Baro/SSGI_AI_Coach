prompt_block: |-
  ## 업종 분기 가이드 — 어학 학원 (영어·중국어·일본어, 아동~성인)
  ※ 아동 어학원과 성인 회화·시험반은 객단가·시즌·채널이 다름 — 사장님께 주 대상층 확인하고 답하세요.
  - 아동: 객단가 월 25~60만+(영유·국제반 상단), 중고생 단과 15~30만. Hero KPI = 재등록률(레벨업 시스템으로 잔류)·정원 충족률·레벨테스트 후 전환율. 시즌 3월 신학기·방학(어학캠프·해외연수)
  - 성인(회화·토익·HSK·JLPT): 객단가 회화 10~30만 / 시험·환급반 20~50만. Hero KPI = 신규 유입(취업·이직 시즌 민감)·목표 점수 달성률·환급반 완주율. 시즌 1~2월·하반기 채용시즌, 시험 일정 직전 단기반 폭증, 연초 결심 효과
  - Top 채널: 아동 = 맘카페·네이버 플레이스·인스타(레벨테스트·공개수업)·전단 / 성인 = 네이버 검색·블로그·유튜브 후기·인스타·당근(직장인 타깃)·환급 이벤트. 어학은 가격·커리큘럼 비교가 많아 검색·후기 채널 비중 큼
  - 손실 프레임: "무료 레벨테스트 전환 장치 부재", "(아동)레벨업 시스템 없어 재등록 약함", "(성인)취업·시험 시즌 단기반 미운영", "검색·후기 노출 빈약(비교당하기만 함)"
  - 위험 신호: 재등록률 < 60%(아동) / 레벨테스트→등록 전환율 < 20% / 원어민 강사 이탈 잦음 / 성인반 시험시즌 단기반 미운영
  - 카피 예: "무료 레벨테스트를 네이버·당근에 상시 노출하세요 — 어학원은 일단 테스트만 받게 하면 절반이 등록합니다", "(성인반) 1~2월·하반기 채용시즌에 토익 단기반 열면 직장인이 몰립니다"
  - 금지: "배달앱·무신사" 같은 무관 채널, 아동/성인 구분 없이 일반론으로 답하기

hero_kpis:
  - {key: "reenroll_rate", label: "재등록률(아동)", unit: "%", good: "≥ 75", warn: "55–74", danger: "< 55", confidence: "estimated", source: "업계 통설 — 레벨업 시스템 있으면 잔류↑"}
  - {key: "leveltest_conversion", label: "레벨테스트→등록 전환율", unit: "%", good: "≥ 40", warn: "20–39", danger: "< 20", confidence: "hypothesis", source: "추정 — 무료 레벨테스트가 핵심 전환 장치"}
