  강사_이탈_위험: "잦음 (원어민 채용·비자 비용 압박)"

risk_signal_weights:   # 검색·비교가 많은 시장 → 노출(코치 활용도) 비중 ↑ / 성인반은 시즌 변동 큼
  action_engagement: 1.1
  competition: 1.1

