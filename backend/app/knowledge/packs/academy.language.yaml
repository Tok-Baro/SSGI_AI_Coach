  - {key: "instagram", name: "인스타그램(공개수업·레벨테스트·후기)", fit: "medium", monthly_budget_min_won: 0, monthly_budget_max_won: 500000, primary_metric: "도달·문의", roi_note: "공개수업·이벤트 콘텐츠. 광고는 일 1,000원+", confidence: "hypothesis"}
