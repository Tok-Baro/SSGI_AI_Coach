# retail.food — 식품 소매 (정육점 / 청과·반찬가게 / 떡집·건강식품)
# ※ 정육(고단가·단골 신뢰·명절), 청과(시세·폐기), 반찬(1인가구·구독), 떡(행사 주문 예약)이 다름 — prompt에서 어느 쪽인지 확인.
# 출처: 업계 통상치 + sme-coach. (식품 소매 세부 단위 통계 미확인 — 추정.)
id: retail.food
name: 식품 소매 (정육·청과·반찬·떡)
group: retail
status: active
version: 1
reviewed_date: 2026-05-11
sources:
  - label: 정육·청과·반찬·떡집 업계 통상치 + sme-coach 플레이북
    year: 2024

match:
  priority: 21   # korean_meat("한우")(25)·noodle_seafood("수산")(22) 보다 먼저 — "한우정육점"·"수산물판매" 가 식당으로 안 가게
  keywords: [정육점, 정육식육, 한우정육점, 축산물판매, 정육판매, 청과상, 과일가게, 청과물, 반찬가게, 반찬전문점, 밑반찬, 김치전문점, 떡집, 떡방앗간, 떡전문점, 건강식품점, 견과류전문점, 미곡상, 쌀가게, 수산물판매]
  ksic_codes: ["47211", "47212", "47214"]   # 식료품 소매 (정육·청과 등)

prompt_block: |-
  ## 업종 분기 가이드 — 식품 소매 (정육점 / 청과·반찬 / 떡집)
  ※ 정육(고단가·품질 신뢰·명절), 청과(시세 변동·폐기), 반찬(1인가구·정기 구독), 떡(돌·환갑·명절 행사 예약)이 서로 다름 — 사장님 가게가 어느 쪽인지 확인하고 답하세요.
  - 정육점: 객단가 큼(2~5만+, 한우·등급·부위), Hero KPI = **단골 비중(품질·등급 신뢰)·명절 시즌 매출(소갈비·정육세트 예약)·고단가 부위 판매 비중**. 원가율 높음
  - 청과·과일가게: Hero KPI = 시세 변동 대응·폐기율(부패)·제철 과일 회전. 마진·로스 동시 큼
  - 반찬가게: Hero KPI = **1인가구·맞벌이 단골·정기 구독/예약 비중**. 점심·저녁 픽업, 명절 차례음식
  - 떡집·방앗간: Hero KPI = **행사 주문(돌·환갑·고사·개업 떡) 예약 비중 — 이게 매출의 큰 축**. 명절·시즌
  - 운영 리듬: 정육·청과는 명절·김장철·제철, 반찬은 평일 저녁 픽업, 떡은 행사 시즌(졸업·입학·돌·환갑·명절) 예약 폭증
  - Top 채널: ① **당근 비즈프로필·카카오 단골방(동네 단골 — 오늘 들어온 한우·제철 과일·신선 반찬·떡 예약 안내) + 네이버 플레이스(동네 검색·예약)** ② 전단·아파트 게시판 ③ (떡·반찬·정육세트) 네이버 예약·전화 예약 ④ (정육) 한우 등급·부위 콘텐츠. 인스타·전국 배달앱 효과 낮음(반찬·떡은 동네 배달 일부)
  - 손실 프레임: "당근·카카오 단골방 미운영(오늘 들어온 신선·예약 안내 못 함)", "(정육) 명절 정육세트 예약 무대응", "(떡) 돌·환갑·고사 떡 예약 페이지 없음", "(반찬) 정기 구독·예약 미운영", "폐기·로스 관리 안 됨(청과·반찬)"
  - 위험 신호: 단골 비중 낮음 / (정육) 명절 시즌 매출 스파이크 없음 / (떡) 행사 주문 비중 낮음 / 폐기율 과다(청과·반찬) / 고단가 부위·세트 판매 저조(정육)
  - 카피 예: "(정육) 명절 한 달 전부터 정육세트·소갈비 예약을 받으세요 — 정육점은 명절 한 시즌이 평소 한두 달치예요. 한우 등급·부위 설명을 단골방에 올리면 신뢰가 쌓입니다", "(떡) 돌·환갑·고사 떡 주문 페이지를 네이버 예약에 만드세요 — 떡집은 행사 예약이 매출의 큰 축이에요"
  - 금지: 정육/청과/반찬/떡 구분 없이 일반론, "인스타에 큰 비용"(식품 소매는 효과 낮음 — 정육·반찬 비주얼 한정)

hero_kpis:
  - {key: "loyal_ratio", label: "단골 비중", unit: "%", good: "≥ 60", warn: "40–59", danger: "< 40", confidence: "estimated", source: "업계 추정 — 품질·신뢰 기반 반복 구매"}
  - {key: "season_order_ratio", label: "행사·명절 예약 비중(정육·떡)", unit: "%", good: "—", confidence: "estimated", source: "추정 — 정육 명절 세트 / 떡 돌·환갑·고사 주문이 매출 큰 축"}
  - {key: "avg_ticket", label: "객단가", unit: "원", good: "정육 ≥ 25,000 / 반찬·청과 ≥ 8,000", warn: "—", danger: "—", confidence: "estimated", source: "추정"}
  - {key: "waste_ratio", label: "폐기율(청과·반찬)", unit: "%", good: "≤ 5", warn: "6–10", danger: "> 10", confidence: "estimated", source: "업계 통설"}

kpi_thresholds:
  단골_비중_위험: "< 40%"
  폐기율_위험: "> 10% (청과·반찬)"

risk_signal_weights:
  population_trend: 1.2

subsidy_tags: [digital, store_renovation, rent_utility]   # POS·스마트상점 / 점포환경개선·냉장/냉동설비·HACCP / 전기요금

channels:
  - {key: "daangn_kakao", name: "당근 비즈프로필·카카오 단골방(신선·예약 안내)", fit: "high", per_unit_cost_won: 10, primary_metric: "재방문·당일 매출·예약", roi_note: "동네 단골에 '오늘 들어온 한우·제철 과일·신선 반찬·떡 예약' 안내. 당근 무료 + 카카오 채널 텍스트 15원·SMS ~10원", confidence: "hypothesis"}
  - {key: "naver_place", name: "네이버 플레이스(동네 검색·예약)", fit: "high", entry_cost_won: 0, primary_metric: "검색·길찾기·예약", roi_note: "무료 등록. 정육세트·떡 행사 예약·반찬 픽업 안내", confidence: "measured", source: "네이버"}
  - {key: "phone_naver_reservation", name: "전화·네이버 예약(정육세트·떡 행사·반찬 구독)", fit: "high", primary_metric: "예약 주문·객단가", roi_note: "정육 명절 세트, 떡 돌·환갑·고사 주문, 반찬 정기 구독 — 예약이 매출 큰 축", confidence: "hypothesis"}
  - {key: "flyer", name: "전단·아파트 게시판", fit: "medium", monthly_budget_min_won: 30000, monthly_budget_max_won: 150000, primary_metric: "배후 단지 노출", roi_note: "명절·김장철·행사 시즌 전단", confidence: "hypothesis"}
  - {key: "instagram", name: "인스타그램(정육·반찬·떡 비주얼 한정)", fit: "low", primary_metric: "도달", roi_note: "한우 마블링·반찬 구성·떡 비주얼 한정 — 식품 소매 일반은 효과 낮음", confidence: "hypothesis"}
  - {key: "delivery_app", name: "동네 배달앱(반찬·떡 한정)", fit: "low", primary_metric: "동네 배달 주문", roi_note: "반찬·떡은 동네 배달 일부 — 정육·청과는 적합도 낮음", confidence: "hypothesis"}

copy_tone:
  vocab: ["동네 단골", "명절 정육세트", "행사 떡 예약", "오늘 들어온 신선", "한우 등급·부위"]
  loss_frames: ["당근·카카오 단골방 미운영", "(정육) 명절 정육세트 예약 무대응", "(떡) 돌·환갑·고사 떡 예약 페이지 없음", "(반찬) 정기 구독·예약 미운영", "폐기·로스 관리 안 됨"]
  examples:
    - "(정육) 명절 한 달 전부터 정육세트·소갈비 예약을 받으세요 — 정육점은 명절 한 시즌이 평소 한두 달치예요. 한우 등급·부위 설명을 단골방에 올리면 신뢰가 쌓입니다"
    - "(떡) 돌·환갑·고사 떡 주문 페이지를 네이버 예약에 만드세요 — 떡집은 행사 예약이 매출의 큰 축이에요"
  do: ["당근·카카오 단골방으로 신선·예약 안내", "(정육·떡) 명절·행사 예약 페이지(네이버/전화) 운영", "(반찬) 정기 구독·픽업 예약"]
  dont: ["정육/청과/반찬/떡 구분 없이 일반론", "인스타에 큰 비용 (식품 소매 일반은 효과 낮음)"]
