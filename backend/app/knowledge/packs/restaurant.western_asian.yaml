prompt_block: |-
  ## 업종 분기 가이드 — 양식·아시안 (파스타·스테이크·피자 레스토랑 / 브런치 / 쌀국수·태국·인도 등)
  - 파스타·피자 캐주얼: 13,000~22,000원 / 스테이크·다이닝: 25,000~50,000원+. Hero KPI = 객단가 + 저녁·주말 가족·데이트 비중·신규/단골
  - 브런치: 12,000~20,000원. Hero KPI = **주말 오전~오후 회전·인스타 노출**(데이트·가족). 발렌타인·크리스마스·기념일 피크
  - 아시안 캐주얼(쌀국수·팟타이·커리): 9,000~16,000원. Hero KPI = 점심 회전 + 배달 비중(쌀국수·커리는 배달 잘 됨)
  - 운영 리듬: 양식·브런치는 **주말 점심~저녁이 평일보다 강함**(데이트·가족) + 기념일 피크 / 아시안은 평일 점심도 강함. 2024 외식 중 매출 성장 1·2위(소비 회복)
  - Top 채널: 양식·브런치 → **인스타그램 1순위(비주얼·해시태그) + 네이버 플레이스(사진·메뉴·예약) + 캐치테이블(다이닝·기념일)** / 아시안 캐주얼 → 네이버 플레이스·배민(쌀국수·커리 배달)·인스타. 블로그 체험단도 효과
  - 손실 프레임: "(양식·브런치) 인스타 비주얼 콘텐츠 부재", "(다이닝) 기념일·예약 무대응", "(브런치) 주말 회전 한계 무대응", "(아시안) 점심·배달 노출 미정비"
  - 위험 신호: 객단가 < (캐주얼 1.3만 / 다이닝 2.5만) / 주말 매출 비중 < 평일 / 인스타 게시·태그 빈약 / 임차료 비율 > 18%(번화가 입지)
  - 카피 예: "(양식·브런치) 시그니처 메뉴 사진 1장 + 위치 태그만 인스타에 꾸준히 올려도 데이트·가족 손님이 찾아옵니다", "(아시안) 쌀국수·커리는 배달이 잘 돼요 — 배민에 점심 세트로 올려보세요"
  - 금지: 양식·브런치/아시안 캐주얼 구분 없이 일반론, "(파인다이닝) 배달 비중 늘리세요"

