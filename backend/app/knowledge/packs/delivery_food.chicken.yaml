# delivery_food.chicken — 치킨 전문점 (배달·포장 중심)
# 출처: 정보공개서 집계(배달 1건 ~25,944원 + 배달팁 ~2,900원, 2024) + KCD 데이터랩 + fcmedia(치킨 시장 8.78조·가맹 3만개, 2024) + sme-coach.
id: delivery_food.chicken
name: 치킨 전문점
group: delivery_food
status: active
version: 1
reviewed_date: 2026-05-11
sources:
  - label: 공정위 가맹 정보공개서 집계 + 한국신용데이터 데이터랩 + fcmedia 치킨 시장 통계 + sme-coach 플레이북
    year: 2024

match:
  priority: 6   # delivery_food(10) 보다 먼저
  keywords: [치킨, 후라이드치킨, 양념치킨, 치킨전문점, 닭강정, 통닭, 치킨호프, 순살치킨, 반반치킨, 치킨집, BBQ, BHC, 교촌, 굽네, 처갓집, 호식이, 페리카나, 멕시카나, 치킨매니아]
  ksic_codes: ["56193"]   # 치킨 전문점

prompt_block: |-
  ## 업종 분기 가이드 — 치킨 전문점 (배달·포장 중심)
  - Hero KPI: ① 객단가(사이드·음료 부착률) ② 배달 비중(온라인 주문이 매출 다수) ③ 배달앱 별점·리뷰 수(노출·전환 직결) ④ 닭·식용유 원가율(육계 시세 변동)
  - 객단가: 배달 1건 평균 약 25,944원 + 배달팁 평균 ~2,900원 → 실결제 ~3만원. 매장/포장은 단품 ~20,000원
  - 운영 리듬: 저녁 17~22시 + 야간 22~24시 피크 / 금·토·일 급증 / 스포츠 이벤트(월드컵·올림픽·프로야구)·치맥 시즌(여름) 스파이크. 치킨 가맹점 3만개·시장 8.78조(2024, +7.3%) — 동네 경쟁 극심
  - Top 채널: ① **배민(우리가게클릭/CPC·울트라콜)·쿠팡이츠·요기요 광고가 최우선**(주문 절대 다수가 배달앱) ② 배달앱 리뷰이벤트(별점 관리) ③ 카카오 친구톡 단골 재주문 쿠폰 ④ 전단(신규 단지). 인스타·블로그 효과 낮음. 공공배달앱(땡겨요 등 수수료 2%대) 병행 권장
  - 손실 프레임: "배달앱 별점·리뷰 관리 안 됨(노출 하락)", "사이드·음료 세트 부착률 저조(객단가 낮음)", "배달 수수료+배달비에 잠식되는 마진(공공배달앱 미활용·차등수수료 미적용)", "단골 재주문 쿠폰 채널 없음"
  - 위험 신호: 배달앱 별점 < 4.3 / 배달 수수료+배달비 비율 > 20% / 객단가 < 18,000원 / 닭·식용유 원가율 > 45%
  - 카피 예: "리뷰이벤트로 별점부터 4.5 위로 올리세요 — 배달앱은 별점이 노출 순위예요", "콜라·치즈볼 같은 사이드 1~2개만 세트로 묶어도 객단가가 3천원 올라갑니다. 공공배달앱(땡겨요)은 수수료 2%대니 같이 쓰세요"
  - 금지: "인스타 사진 톤 통일에 투자"(치킨은 SNS 효과 낮음), "예약 시스템 도입"(배달 위주엔 무관)

hero_kpis:
  - {key: "review_rating", label: "배달앱 별점", unit: "점", good: "≥ 4.5", warn: "4.3–4.49", danger: "< 4.3", confidence: "estimated", source: "업계 통설 — 별점이 노출 순위에 직접"}
  - {key: "avg_ticket", label: "객단가(배달 1건)", unit: "원", good: "≥ 25,000", warn: "18,000–24,999", danger: "< 18,000", confidence: "estimated", source: "정보공개서 집계 — 배달 ~25,944원 + 배달팁(2024)"}
  - {key: "delivery_cost_ratio", label: "배달 수수료+배달비 비율", unit: "% 배달매출", good: "≤ 12", warn: "13–20", danger: "> 20", confidence: "estimated", source: "추정 — 배민/요기요/쿠팡이츠 수수료 + 배달비. 2026 차등수수료 2.0~7.8%"}
  - {key: "food_cost_ratio", label: "식재료비 비율(닭·기름·파우더·박스)", unit: "% 매출", good: "≤ 38", warn: "39–45", danger: "> 45", confidence: "estimated", source: "추정 — 육계·식용유 시세 직격"}

kpi_thresholds:
  별점_위험: "< 4.3"
  배달_비용_비율_위험: "> 20% (배달매출 대비)"
  객단가_위험: "< 18,000원"

risk_signal_weights:   # 배달 위주 → 채널 운영(코치 활용도) 비중↑ / 입지 유동인구 ↓ / 동네 치킨 경쟁 극심
  action_engagement: 1.2
  population_trend: 0.9
  competition: 1.1

subsidy_tags: [digital, marketing, store_renovation]   # 스마트상점·POS·주방 / 배달앱·배달비 지원·공공배달앱·차등수수료 / 점포환경개선

channels:
  - {key: "baemin_coupang_yogiyo", name: "배민·쿠팡이츠·요기요 광고(우리가게클릭·울트라콜)", fit: "high", entry_cost_won: 88000, fee_pct: 9.8, primary_metric: "배달 주문", roi_note: "주문 절대 다수가 배달앱. 깃발 88,000원/월·CPC 200~600원·중개수수료 별도. 1~2개부터", confidence: "hypothesis", source: "배민/요기요 광고 단가"}
  - {key: "review_event", name: "배달앱 리뷰이벤트(별점 관리)", fit: "high", primary_metric: "별점·리뷰 수", roi_note: "서비스 추가·리뷰 약속 — 별점이 노출·전환에 직결. 비용 = 서비스 원가", confidence: "hypothesis"}
  - {key: "public_delivery", name: "공공배달앱(땡겨요·배달특급 등)", fit: "medium", fee_pct: 2.0, primary_metric: "배달 주문(저수수료)", roi_note: "수수료 2%대 — 배민과 병행해 마진 방어", confidence: "measured", source: "공공배달앱"}
  - {key: "kakao_friendtalk", name: "카카오 친구톡(단골 재주문 쿠폰)", fit: "medium", per_unit_cost_won: 15, primary_metric: "재주문", roi_note: "텍스트 15원/이미지 18원/건(VAT 별도). 야간 단골 재주문 쿠폰", confidence: "measured", source: "카카오 비즈메시지"}
  - {key: "flyer", name: "전단지(신규 아파트 단지)", fit: "low", monthly_budget_min_won: 50000, monthly_budget_max_won: 200000, primary_metric: "배포→첫 주문", roi_note: "신규 단지 외 비추. 반응률 1% 미만 가설", confidence: "hypothesis"}
  - {key: "instagram_musinsa", name: "인스타그램·무신사 등", fit: "avoid", primary_metric: "도달", roi_note: "치킨은 SNS·패션 채널 효과 낮음 — 비추천", confidence: "hypothesis"}

copy_tone:
  vocab: ["배달앱 노출 점수", "별점 관리", "사이드 부착률", "공공배달앱", "야간 단골"]
  loss_frames: ["배달앱 별점·리뷰 관리 안 됨(노출 하락)", "사이드·음료 세트 부착률 저조", "배달 수수료에 잠식되는 마진(공공배달앱 미활용)", "단골 재주문 쿠폰 채널 없음"]
  examples:
    - "리뷰이벤트로 별점부터 4.5 위로 올리세요 — 배달앱은 별점이 노출 순위예요"
    - "콜라·치즈볼 같은 사이드 1~2개만 세트로 묶어도 객단가가 3천원 올라갑니다. 공공배달앱(땡겨요)은 수수료 2%대니 같이 쓰세요"
  do: ["배달앱 리뷰이벤트로 별점 4.5+ 유지", "사이드·음료 세트로 객단가↑", "공공배달앱 병행 + 차등수수료 적용 확인"]
  dont: ["인스타 사진 톤 통일에 투자 (치킨은 SNS 효과 낮음)", "예약 시스템 도입 (배달 위주엔 무관)"]
