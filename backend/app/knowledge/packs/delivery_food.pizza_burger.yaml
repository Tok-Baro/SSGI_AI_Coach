prompt_block: |-
  ## 업종 분기 가이드 — 피자·버거·샌드위치 (패스트푸드, 배달·포장 중심)
  - Hero KPI: ① 객단가(피자=사이드·콜라 세트, 버거=세트 전환율) ② 배달 비중·시간(피자는 주말 저녁, 버거는 점심·심야) ③ 배달앱 별점·리뷰 ④ 프로모션 의존도(피자는 1+1·할인 민감)
  - 객단가: 피자 배달 건당 25,000~40,000원(1인 싱글피자 출시로 1.5만원대도), 버거 배달 건당 12,000~20,000원, 샌드위치·토스트 매장 1인 5,000~9,000원 (추정). 배달 전체 1회 평균 ~24,674원(배달료 포함, 2.8인분)
  - 운영 리듬: 피자 — 금·토·일 저녁, 일요일 가족 모임↑ / 버거 — 점심·심야·평일도 고른 편 / 명절 연휴·시험기간·스포츠 이벤트 스파이크
  - Top 채널: ① **배민·요기요·쿠팡이츠 광고+쿠폰(피자는 할인 프로모션이 전환 핵심)** ② 네이버 플레이스 ③ 배달앱 리뷰이벤트 ④ 인스타(수제버거·시그니처 한정). 토스트·샌드위치는 오피스가 플레이스+카카오 단골 알림 비중↑. 공공배달앱 병행
  - 손실 프레임: "(피자) 1+1·할인 프로모션·세트 구성 미흡", "(버거) 세트 전환 유도 약함", "배달앱 별점·리뷰 관리 안 됨", "(토스트·샌드위치) 오피스가 점심 검색·단골 알림 미정비"
  - 위험 신호: 객단가 < (피자 2만 / 버거 1.2만) / 배달 수수료+배달비 비율 > 20% / 별점 < 4.3 / 프로모션 없으면 주문 급감(피자)
  - 카피 예: "(피자) 1+1·콜라 세트·사이드 묶음 1~2개만 만들어 배민에 올려도 객단가가 올라가요 — 피자는 할인이 곧 전환이에요", "(토스트·샌드위치) 오피스가라면 네이버 플레이스 점심 검색 + 단골 카톡 적립이 배달앱보다 효율적일 수 있어요"
  - 금지: 피자/버거/토스트 구분 없이 일반론, "예약 시스템 도입"(패스트푸드엔 무관)

