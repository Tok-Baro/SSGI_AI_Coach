  폐기율_위험: "> 10%"
  원가율_위험: "> 45%"

risk_signal_weights:   # 유동·나들이 상권 의존 + 시즌 변동 극심 → 매출 추세·유동인구 비중↑
  population_trend: 1.2
  sales_trend: 1.1

