prompt_block: |-
  ## 업종 분기 가이드 — 음료 전문 (버블티·과일주스·스무디·생과일 — 비커피)
  - Hero KPI: ① **여름 성수기 매출 의존도**(7~9월 vs 12~2월 30~40% 감소 — 비수기 대비가 hero) ② 일 판매잔수(박리다매) ③ 재료 폐기율(과일 부패) ④ 인스타 비주얼(버블티·생과일은 비주얼 소비)
  - 객단가: 1잔 1,500~6,000원(저가 주스 1,000~3,000원, 버블티·프리미엄 스무디 4,000~6,000원). 단체·픽업 주문 시 건당↑ (추정)
  - 운영 리듬: **여름(6~9월) 폭증, 한겨울 매출 30~40%↓** / 오후 14~18시(간식 시간) / 주말 나들이 상권↑ / 겨울 메뉴 다각화(붕어빵·따뜻한 음료) 필요
  - Top 채널: ① 인스타그램·틱톡(컬러풀 비주얼·신메뉴) ② 네이버 플레이스 ③ 배민·요기요(여름 한정 배달 — 디저트/음료 카테고리) ④ 카카오 스탬프
  - 손실 프레임: "겨울 비수기 메뉴·매출 무대응(여름만 바라봄)", "인스타·틱톡 비주얼 콘텐츠 부재", "과일 폐기율 관리 안 됨", "여름 배달(배민 음료 카테고리) 미활용"
  - 위험 신호: 겨울 매출 < 여름 매출의 50% / 재료 폐기율 과다 / 일 판매잔수 저조 / 영업이익률 한 자릿수 미만
  - 카피 예: "여름 한 철 장사로 끝내지 마세요 — 겨울엔 따뜻한 음료·붕어빵·호떡 같은 곁들임으로 비수기 매출을 절반은 채울 수 있어요", "신메뉴 음료는 색이 예뻐야 팔려요 — 인스타·틱톡에 컬러풀한 사진/영상을 올리세요"
  - 금지: "배민 광고비 상시 집행"(여름 시즌 외엔 ROI 낮음), "커피전문점처럼 운영"(비커피는 시즌 의존·박리다매가 본질)

hero_kpis:
  - {key: "winter_ratio", label: "겨울 매출 (여름 대비)", unit: "%", good: "≥ 60", warn: "50–59", danger: "< 50", confidence: "estimated", source: "업계 — 한겨울 30~40% 감소"}
  - {key: "avg_ticket", label: "객단가", unit: "원/잔", good: "버블티·스무디 ≥ 4,000 / 저가주스 ≥ 2,000", warn: "—", danger: "—", confidence: "estimated", source: "추정"}
  - {key: "waste_ratio", label: "재료 폐기율(과일)", unit: "%", good: "≤ 5", warn: "6–10", danger: "> 10", confidence: "estimated", source: "업계 통설 — 과일 부패"}
  - {key: "food_cost_ratio", label: "재료 원가율", unit: "% 매출", good: "≤ 35", warn: "36–45", danger: "> 45", confidence: "estimated", source: "추정 — 과일 시세 변동·폐기 큼"}

kpi_thresholds:
