# cafe.beverage — 음료 전문 (버블티·과일주스·스무디·생과일 — 비커피)
# 출처: 식품외식경제·foodbank 업계 분석 + GS25 생과일스무디 매출 사례(2025) + sme-coach. (한국 공식 객단가 통계 미확인 — 추정.)
