  - {key: "baemin_yogiyo", name: "배민·요기요(여름 한정 배달 — 디저트/음료)", fit: "medium", entry_cost_won: 88000, primary_metric: "여름 배달 주문", roi_note: "여름 성수기에만 ROI 높음. 깃발 88,000원/월 — 시즌 집행 권장", confidence: "hypothesis"}
  - {key: "kakao_stamp", name: "카카오 친구톡·스탬프", fit: "medium", per_unit_cost_won: 15, primary_metric: "재방문", roi_note: "카카오 채널 텍스트 15원/건(VAT 별도). 스탬프 적립", confidence: "measured", source: "카카오 비즈메시지"}
  - {key: "kakaomap", name: "카카오맵(등록)", fit: "low", entry_cost_won: 0, primary_metric: "위치 검색", roi_note: "무료", confidence: "measured", source: "카카오"}
  - {key: "musinsa", name: "무신사·패션 입점", fit: "avoid", applicable: false, roi_note: "해당 없음", confidence: "measured"}

