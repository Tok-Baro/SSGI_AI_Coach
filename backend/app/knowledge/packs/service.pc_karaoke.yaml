  loss_frames: ["당근·네이버 플레이스 미정비(동네 신규 유입 누락)", "(PC방) 먹거리 메뉴·매출 방치", "평일 낮 공석 무대응", "신상 좌석·시설 노후 무대응(가격 경쟁만 함)", "심야·주말 피크 운영 비효율"]
