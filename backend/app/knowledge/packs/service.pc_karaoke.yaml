prompt_block: |-
  ## 업종 분기 가이드 — PC방·노래방·당구장 (시간제 여가시설)
  ※ PC방·코인노래방·당구장·만화카페·스크린골프 등은 모두 "시간당 요금 × 좌석/룸 = 회전율" 구조 — 사장님 가게가 어느 쪽인지 확인하고 답하세요.
  - Hero KPI: ① **좌석/룸 회전율(시간당 점유율 — 야간·주말 피크 시간대 가동률이 매출의 전부)** ② 시간당 요금(가격 경쟁 vs 프리미엄 좌석·룸 차등) ③ (PC방) 먹거리 매출 비중(라면·치킨·음료 — PC방 매출의 30~50%까지) ④ 1인당 평균 체류시간·재방문
  - 객단가/요금: PC방 1,500~2,500원/시(프리미엄·신상 좌석 더), 코인노래방 곡당 500~1,000원·시간제 1.5~3만/시, 당구장 1~2만/시, 만화카페 시간제. (추정)
  - 운영 리듬: **저녁~심야·주말 종일이 본질** / 방학·시험기간(PC방)·연말·금토 / 비·한파 등 실내 수요↑ / 평일 낮 공석 관리(시니어 당구·재택 PC 등)
  - Top 채널: ① **당근 비즈프로필·당근 광고(동네 시간제 시설 — 신규 유입) + 네이버 플레이스(좌석·요금·시설 사진)** ② 인스타그램(신상 좌석·이벤트·신메뉴(PC방 먹거리)) ③ 카카오 채널/문자(쿠폰·이벤트 — 시간 추가 증정 등) ④ 아파트·학원가 전단. 배달·블로그 효과 낮음. PC방은 먹거리를 배달앱(픽업)에 올리는 것도 검토
  - 손실 프레임: "당근·네이버 플레이스 미정비(동네 신규 유입 누락)", "(PC방) 먹거리 메뉴·매출 방치(매출의 30~50%인데)", "평일 낮 공석 무대응", "신상 좌석·시설 노후 무대응(가격 경쟁만 함)", "심야·주말 피크 시간대 인력·운영 비효율"
  - 위험 신호: 피크 시간대 좌석 가동률 < 50% / (PC방) 먹거리 매출 비중 낮음 / 시간당 요금 정체(원가만 오름) / 시설 노후로 단가 못 올림
  - 카피 예: "(PC방) 라면·치킨 같은 먹거리가 매출의 30~50%예요 — 메뉴 늘리고 좌석에서 주문되게 만드세요. 그게 시간당 요금 인상보다 효과 큽니다", "당근에 '신상 좌석 입고·시간 추가 이벤트' 한 줄 올리면 동네 손님이 새로 옵니다", "평일 낮은 비어 있죠? 시니어 당구·재택근무 PC 같은 평일 낮 요금제를 만드세요"
  - 금지: "예약 시스템 도입"(시간제 워크인 업종엔 거의 무관 — 당구·스크린골프 일부 예외), "인스타에 큰 비용"(시간제 여가시설은 효과 보통)

hero_kpis:
  - {key: "peak_utilization", label: "피크 시간대 좌석/룸 가동률", unit: "%", good: "≥ 70", warn: "50–69", danger: "< 50", confidence: "estimated", source: "업계 추정 — 야간·주말 가동률이 매출 핵심"}
  - {key: "food_sales_ratio", label: "먹거리 매출 비중(PC방)", unit: "%", good: "≥ 35", warn: "20–34", danger: "< 20", confidence: "estimated", source: "업계 통설 — PC방 매출의 30~50%"}
  - {key: "hourly_rate", label: "시간당 요금", unit: "원", good: "—", confidence: "estimated", source: "추정 — PC방 1,500~2,500원/시 등. 프리미엄 좌석·룸 차등이 변수"}
  - {key: "review_rating", label: "당근·네이버 후기", unit: "점", good: "≥ 4.3", warn: "4.0–4.29", danger: "< 4.0", confidence: "estimated", source: "업계 통설"}

