prompt_block: |-
  ## 업종 분기 가이드 — 주점·술집 (호프·생맥주·포차 / 와인바·칵테일바)
  - Hero KPI: **야간 매출 비중 + 금·토 매출 집중도** + 주류 마진 + 테이블 체류·재방문(단골). 안주 회전보다 좌석·시간당 매출이 hero
  - 객단가: 호프·생맥주 1인 12,000~20,000원 / 포차 15,000~25,000원 / 와인바·칵테일바 20,000~40,000원+ (체류 길어 테이블 객단가는 더 큼)
  - 운영 리듬: **저녁 19시~심야, 금·토에 주중 합산 이상 매출** / 연말(12월 송년회) 최대 성수기 / 여름(맥주·치맥) 성수기 / 1월·명절 직후 비수기 / 날씨·기온 민감(테라스·포차)
  - Top 채널: **인스타그램 1순위(분위기·안주샷·이벤트) + 네이버 플레이스("○○역 술집" 검색)·카카오맵** / 와인바·칵테일바는 캐치테이블(예약)도 / 당근(동네 단골) / 카카오 채널 단골 이벤트 공지. 배달·전단 효과 낮음
  - 손실 프레임: "분위기·안주·이벤트 인스타 콘텐츠 부재", "'○○역 술집' 네이버 플레이스 검색 노출 미정비", "12월 송년회·여름 치맥 시즌 무대응", "단골 이벤트 공지 채널 없음"
  - 위험 신호: 야간(19시 이후) 매출 비중 < 70% / 금·토 매출 < 주중 합산 / 12월 매출 스파이크 없음 / 인스타 게시 빈약
  - 카피 예: "12월 송년회 시즌엔 단체석·예약을 미리 받으세요 — 술집은 12월 한 달이 1·2월 두 달치예요", "안주 한 접시·테라스 사진 1장만 인스타에 올려도 '○○역 술집' 검색에서 위로 올라옵니다"
  - 금지: "점심 회전율 올리세요"(야간 업종엔 무관), "배달 비중 늘리세요"(주점은 배달 적합도 낮음), 유흥·단란주점에 일반 소상공인 지원사업 권하기(제외 대상 — 공고 확인)

hero_kpis:
  - {key: "night_sales_ratio", label: "야간(19시 이후) 매출 비중", unit: "%", good: "≥ 80", warn: "70–79", danger: "< 70", confidence: "estimated", source: "업계 추정 — 주점은 야간이 본질"}
  - {key: "weekend_concentration", label: "금·토 매출 집중도", unit: "% (주중 합산 대비)", good: "≥ 100", warn: "70–99", danger: "< 70", confidence: "estimated", source: "업계 추정 — 금·토가 주중 합산 이상"}
  - {key: "avg_ticket", label: "테이블 객단가", unit: "원", good: "호프 ≥ 30,000 / 와인바 ≥ 50,000 (테이블 기준)", warn: "—", danger: "—", confidence: "estimated", source: "추정 — 1인 호프 1.2~2만, 체류 길어 테이블 단가는 더 큼"}
  - {key: "liquor_cost_ratio", label: "주류·안주 혼합 원가율", unit: "% 매출", good: "≤ 35", warn: "36–40", danger: "> 40", confidence: "estimated", source: "추정 — 주류 25~30%·안주 30~40%"}

kpi_thresholds:
  야간_매출_비율_위험: "< 70%"
  금토_집중도_위험: "< 주중 합산"
  혼합_원가율_위험: "> 40%"

