  - {key: "naver_place", name: "네이버 플레이스(등록·광고·후기)", fit: "high", entry_cost_won: 0, primary_metric: "검색·후기", roi_note: "무료 등록 + CPC 광고. 후기·만족도 관리. (효과 과장 표현 주의)", confidence: "measured", source: "네이버"}
  - {key: "kakao_friendtalk", name: "카카오 친구톡(회원권 소진·갱신 알림)", fit: "high", per_unit_cost_won: 15, primary_metric: "갱신율·재방문", roi_note: "텍스트 15원/이미지 18원/건(VAT 별도). 8회 차쯤 '곧 소진' 갱신 알림 — 핵심", confidence: "measured", source: "카카오 비즈메시지"}
  - {key: "instagram", name: "인스타그램(시술 결과·매장 분위기)", fit: "medium", monthly_budget_min_won: 0, monthly_budget_max_won: 500000, primary_metric: "도달·DM", roi_note: "BEFORE/AFTER·분위기 — 단 의료·미용 광고 규제(과장 표현·치료 표현 금지). 광고 일 1,000원+", confidence: "hypothesis"}
  - {key: "referral_reward", name: "친구 추천 보상", fit: "medium", primary_metric: "신규 유입", roi_note: "양쪽 할인·추가 1회 서비스(호혜성)", confidence: "hypothesis"}
  - {key: "baemin_musinsa", name: "배민·무신사 등", fit: "avoid", applicable: false, roi_note: "해당 없음", confidence: "measured"}

