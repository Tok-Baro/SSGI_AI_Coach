  vocab: ["회원권 갱신", "다회권 소진", "베드 가동률", "평일 낮 회원권", "BEFORE/AFTER"]
  loss_frames: ["회원권 소진·갱신 시점 알림 없음", "회당 결제 위주(다회권 판매 안 됨 → 매출 불안정)", "평일 낮 공석 관리 무대응", "네이버 예약 미도입"]
  examples:
    - "회원권 8회 차쯤 '곧 소진되시네요, 갱신하시면 추가 1회 드려요' 카톡을 보내세요 — 그 한 통이 갱신율을 크게 올립니다"
    - "평일 낮은 비어 있죠? 주부·시니어 대상 평일 낮 회원권을 따로 만드세요"
  do: ["다회권 소진(8회 차 등) 시점 갱신 카톡 알림", "평일 낮 전용 회원권으로 공석 채우기", "네이버 예약 + 플레이스 후기 관리"]
