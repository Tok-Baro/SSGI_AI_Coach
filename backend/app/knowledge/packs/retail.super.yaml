  vocab: ["동네 단골", "오늘 들어온 신선", "전화 주문 배송", "세일 알림", "신선식품 비중"]
  loss_frames: ["오늘 들어온 신선·세일 알림 채널 없음", "전화 주문·동네 배송 미운영", "신선식품 품질·구색 방치", "폐기·로스 관리 안 됨"]
  examples:
