# 출처: 업계 통상치 + sme-coach. (개인 슈퍼 단위 통계 미확인 — 추정.)
id: retail.super
name: 동네 슈퍼마켓
group: retail
status: active
version: 1
reviewed_date: 2026-05-11
sources:
  - label: 동네 슈퍼·식자재마트 업계 통상치 + sme-coach 플레이북
