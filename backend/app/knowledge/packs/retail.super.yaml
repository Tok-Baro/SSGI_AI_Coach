    - "전화 한 통이면 갖다드리는 배송을 시작하세요 — 거동 불편하신 어르신·맞벌이 단골이 편의점·온라인 안 가고 우리만 씁니다"
  do: ["카카오 단골방·당근으로 매일 신선·세일 알림", "전화 주문·동네 배송 운영(단골 락인)", "신선식품 구색·품질로 차별화"]
  dont: ["가격으로 대형마트와 정면 경쟁 (질 수밖에 없음)", "인스타에 큰 비용 (동네 슈퍼는 효과 낮음)"]
