  - {key: "instagram", name: "인스타그램(스시·이자카야 비주얼)", fit: "medium", monthly_budget_min_won: 0, monthly_budget_max_won: 500000, primary_metric: "도달·문의", roi_note: "오마카세·이자카야는 비주얼·분위기 콘텐츠 효과. 광고는 일 1,000원+", confidence: "hypothesis"}
  - {key: "kakaomap", name: "카카오맵(등록)", fit: "medium", entry_cost_won: 0, primary_metric: "위치 검색·모임", roi_note: "무료", confidence: "measured", source: "카카오"}
  - {key: "baemin", name: "배민 울트라콜", fit: "low", entry_cost_won: 88000, primary_metric: "배달 주문", roi_note: "돈까스·우동·라멘 일부만(분식형 배달). 스시·오마카세·이자카야는 배달 적합도 낮음", confidence: "hypothesis"}
  - {key: "musinsa", name: "무신사·패션 입점", fit: "avoid", applicable: false, roi_note: "해당 없음", confidence: "measured"}

