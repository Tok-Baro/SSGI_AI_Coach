prompt_block: |-
  ## 업종 분기 가이드 — 일식·회 (돈까스·우동 / 초밥·오마카세 / 이자카야)
  - 돈까스·우동·라멘(저가 회전형): 7,000~13,000원. Hero KPI = 점심 회전율·객수. 평일 점심 중심. 배달도 가능(분식형)
  - 초밥·스시야·오마카세: 회전초밥 12,000~25,000원 / 스시야 2~5만+ / 오마카세 5~15만+. Hero KPI = **객단가 + 예약 점유율(좌석 회전·노쇼 관리)**. 금토 저녁·기념일·연말 예약 집중. 원가율 40~50%(생선·로스)
  - 이자카야·일본식주점: 1인 20,000~35,000원(주류 포함). Hero KPI = 저녁/야간 매출·주류 비중·테이블 체류 객단가. 평일 퇴근후~심야·금토 피크
  - 운영 리듬: 돈까스 평일 점심 / 스시·오마카세 금토 저녁 + 기념일·연말 / 이자카야 평일 퇴근후~심야·금토. 2024 일식 회복세
  - Top 채널: 돈까스·우동 → 네이버 플레이스·카카오맵·배민(배달) / 스시야·오마카세·고급 일식당 → **캐치테이블 1순위(예약·노쇼 보증금) + 인스타(비주얼) + 네이버 플레이스 광고** / 이자카야 → 인스타·네이버 플레이스·카카오맵(모임 검색)
  - 손실 프레임: "(스시·오마카세) 예약 시스템 부재(노쇼·공석 방치)", "(오마카세) 기념일·연말 예약 무대응", "(이자카야) 인스타 분위기·안주 콘텐츠 부재", "(돈까스) 점심 검색 노출 미정비"
  - 위험 신호: (스시·오마카세) 예약 점유율 < 60% / 노쇼율 과다 / 원가(생선) 로스율 과다 / (돈까스) 점심 회전율 < 1.5회 / (이자카야) 야간 매출 비중 < 60%
  - 카피 예: "(오마카세·스시야) 캐치테이블에 노쇼 보증금을 걸어두세요 — 공석 한 자리가 하루 매출의 10%입니다", "(이자카야) 안주·분위기 사진 1장만 인스타에 올려도 '○○역 이자카야' 검색에서 위로 올라옵니다"
  - 금지: 돈까스/스시·오마카세/이자카야 구분 없이 일반론, "배달 비중 늘리세요"(오마카세·이자카야엔 무관)

hero_kpis:
  - {key: "avg_ticket", label: "객단가", unit: "원", good: "돈까스 ≥ 9,000 / 회전초밥 ≥ 15,000 / 오마카세 ≥ 50,000 / 이자카야 ≥ 20,000", warn: "—", danger: "—", confidence: "estimated", source: "추정"}
  - {key: "reservation_fill", label: "예약 점유율(스시·오마카세)", unit: "%", good: "≥ 70", warn: "50–69", danger: "< 50", confidence: "estimated", source: "업계 추정 — 좌석 회전·노쇼 관리 핵심"}
  - {key: "lunch_turnover", label: "점심 회전율(돈까스·우동)", unit: "회", good: "≥ 2.5", warn: "1.5–2.4", danger: "< 1.5", confidence: "estimated", source: "업계 추정"}
  - {key: "food_cost_ratio", label: "식재료비 비율", unit: "% 매출", good: "돈까스 ≤ 38 / 스시 ≤ 45", warn: "—", danger: "스시 > 50", confidence: "estimated", source: "추정 — 스시·회는 생선 원가·로스 큼"}

