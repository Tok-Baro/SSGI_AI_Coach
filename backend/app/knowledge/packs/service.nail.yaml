prompt_block: |-
  ## 업종 분기 가이드 — 네일·왁싱·속눈썹 (뷰티 시술)
  - Hero KPI: ① **재방문 주기 관리(네일·속눈썹은 3~4주, 왁싱은 4~6주 주기로 재방문 — 주기 도래 알림이 핵심)** ② 예약 비율(워크인 거의 없는 예약형) ③ 좌석/베드 회전율(2~3회/일) ④ 시술 단가(아트·디자인 추가 부착률) ⑤ 후기 별점·인스타 디자인 노출
  - 객단가: 네일(젤·아트) 3~8만, 페디큐어 추가 시 더 큼 / 왁싱 2~5만 / 속눈썹 연장 5~12만 (추정)
  - 운영 리듬: 주말·연휴·휴가철·여행 직전 폭증 / 결혼·졸업·연말 시즌 / 네일·속눈썹은 정기 주기 재방문이 매출의 큰 축
  - Top 채널: ① **인스타그램(네일 디자인·속눈썹 작업물이 곧 마케팅 — 비주얼 소비) + 네이버 예약(예약형이라 거의 필수)** ② 네이버 플레이스(별점·후기·디자인 사진) ③ 카카오 친구톡(재방문 주기 도래 알림 — 가장 효과적) ④ 당근(동네 신규). 배달·블로그 효과 낮음
  - 손실 프레임: "재방문 주기 도래 알림 없음(3~4주 지나면 다른 곳 감)", "인스타 디자인 포트폴리오 부재(작업물이 곧 광고인데)", "네이버 예약 미도입(빈 시간대 안 보임)", "후기 별점·디자인 사진 미관리"
  - 위험 신호: 재방문율 < 50% / 예약 비율 < 50% / 베드 회전율 < 1.5회 / 후기 별점 < 4.5 / 인스타 디자인 게시 빈약
  - 카피 예: "단골 네일은 3~4주 주기예요 — 마지막 시술 3주 차에 '리터치 시즌이에요' 카톡 한 통이면 다시 옵니다", "오늘 한 네일·속눈썹 작업물을 매일 한 장씩 인스타에 올리세요 — 네일샵은 디자인 사진이 전부예요"
  - 금지: "배달앱 광고", 시술 효과 과장 단정(광고 규제), 미용실(헤어)과 동일하게 취급(주기 관리·인스타 디자인이 더 핵심)

hero_kpis:
  - {key: "revisit_rate", label: "재방문율(주기 재방문)", unit: "%", good: "≥ 60", warn: "40–59", danger: "< 40", confidence: "estimated", source: "업계 추정 — 네일·속눈썹 3~4주 주기"}
  - {key: "booking_ratio", label: "예약 비율", unit: "%", good: "≥ 70", warn: "50–69", danger: "< 50", confidence: "estimated", source: "업계 추정 — 워크인 거의 없는 예약형"}
  - {key: "bed_turnover", label: "베드 회전율", unit: "회/일", good: "≥ 2.5", warn: "1.5–2.4", danger: "< 1.5", confidence: "estimated", source: "업계 추정"}
  - {key: "review_rating", label: "네이버 후기 별점", unit: "점", good: "≥ 4.7", warn: "4.5–4.69", danger: "< 4.5", confidence: "estimated", source: "업계 통설"}
  - {key: "instagram_activity", label: "인스타 디자인 콘텐츠", unit: "게시/월", good: "≥ 12", warn: "5–11", danger: "< 5", confidence: "hypothesis", source: "추정 — 작업물 사진이 핵심 마케팅"}

kpi_thresholds:
  재방문율_위험: "< 40%"
  예약_비율_위험: "< 50%"
  베드_회전율_위험: "< 1.5회"
  별점_위험: "< 4.5"

risk_signal_weights:
  action_engagement: 1.1

