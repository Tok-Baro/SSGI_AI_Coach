  - {key: "kakao_friendtalk", name: "카카오 친구톡(재방문 주기 도래 알림)", fit: "high", per_unit_cost_won: 15, primary_metric: "재방문", roi_note: "텍스트 15원/이미지 18원/건(VAT 별도). 마지막 시술 3주 차 '리터치 시즌' 알림 — 가장 효과적", confidence: "measured", source: "카카오 비즈메시지"}
  - {key: "daangn", name: "당근 비즈프로필", fit: "medium", entry_cost_won: 0, primary_metric: "동네 신규 노출", roi_note: "무료", confidence: "hypothesis"}
  - {key: "baemin_musinsa", name: "배민·무신사 등", fit: "avoid", applicable: false, roi_note: "해당 없음", confidence: "measured"}

