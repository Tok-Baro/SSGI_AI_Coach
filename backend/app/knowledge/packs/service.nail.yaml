  vocab: ["재방문 주기", "리터치 시즌", "디자인 포트폴리오", "예약", "베드 회전"]
  loss_frames: ["재방문 주기 도래 알림 없음(3~4주 지나면 다른 곳 감)", "인스타 디자인 포트폴리오 부재", "네이버 예약 미도입(빈 시간 안 보임)", "후기 별점·디자인 사진 미관리"]
  examples:
