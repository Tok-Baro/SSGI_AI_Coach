  - {key: "kakao_sms", name: "카카오 채널·문자(완료 알림·픽업·환절기 안내)", fit: "medium", per_unit_cost_won: 10, primary_metric: "재방문·픽업률", roi_note: "빨래 완료·픽업·환절기 드라이 안내. SMS 건당 ~10원·카카오 채널 텍스트 15원", confidence: "measured", source: "카카오 비즈메시지·SMS 단가"}
  - {key: "apt_board_flyer", name: "아파트 단지 게시판·전단", fit: "medium", monthly_budget_min_won: 30000, monthly_budget_max_won: 150000, primary_metric: "배후 단지 노출", roi_note: "반경 좁은 업종 — 배후 단지 게시판·전단", confidence: "hypothesis"}
  - {key: "laundry_app", name: "빨래 대행 앱(런드리고류) 입점", fit: "medium", primary_metric: "픽업·배송 주문", roi_note: "일반 세탁소 한정 — 1인 가구·바쁜 직장인 픽업/배송 수요", confidence: "hypothesis"}
  - {key: "instagram_baemin", name: "인스타그램·배민 등", fit: "avoid", primary_metric: "—", roi_note: "세탁업은 SNS·일반 배달앱 효과 낮음 — 비추천", confidence: "hypothesis"}

