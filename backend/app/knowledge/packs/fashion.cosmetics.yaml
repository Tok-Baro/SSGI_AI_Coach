  - {key: "naver_place", name: "네이버 플레이스(검색·후기)", fit: "high", entry_cost_won: 0, primary_metric: "검색·후기", roi_note: "무료 등록 + CPC 광고. 후기·시향 가능 안내", confidence: "measured", source: "네이버"}
  - {key: "kakao_friendtalk", name: "카카오 친구톡(소진 주기·신상·세트 알림)", fit: "medium", per_unit_cost_won: 15, primary_metric: "재구매·세트 판매", roi_note: "텍스트 15원/이미지 18원/건(VAT 별도). 기초 소진 주기(2~3개월)·기획세트 알림", confidence: "measured", source: "카카오 비즈메시지"}
  - {key: "influencer", name: "체험단·뷰티 인플루언서(니치 제품)", fit: "medium", monthly_budget_min_won: 100000, monthly_budget_max_won: 500000, primary_metric: "노출·신뢰", roi_note: "니치 향수·전문 라인 한정 — 흔한 제품은 효과 낮음", confidence: "hypothesis"}
  - {key: "daangn", name: "당근 비즈프로필", fit: "low", entry_cost_won: 0, primary_metric: "동네 노출", roi_note: "무료", confidence: "hypothesis"}
  - {key: "baemin", name: "배민(배달앱)", fit: "avoid", applicable: false, roi_note: "해당 없음", confidence: "measured"}

copy_tone:
  vocab: ["세트·기획 구성", "체험·시향", "니치 라인", "소진 주기", "발색샷"]
  loss_frames: ["체험·테스터·상담 동선 없음(온라인이랑 차별 없음)", "세트·기획 구성 미운영(단품만 — 마진 안 남음)", "니치/전문 라인 부재(올리브영에 짐)", "단골 소진 주기·신상 알림 채널 없음", "인스타 발색샷·향 콘텐츠 빈약"]
  examples:
    - "올리브영에 없는 니치 향수·전문 라인 하나라도 갖추고, 시향·체험 동선을 만드세요 — 그게 우리만의 이유가 됩니다"
    - "기초 화장품 단골은 2~3개월 주기로 떨어져요 — 그 시점에 '신상 + 세트 할인' 카톡을 보내세요"
  do: ["니치/전문 라인 + 시향·체험 동선으로 차별화", "세트·기획 구성으로 객단가↑", "소진 주기 카톡 알림 + 인스타 발색·향 콘텐츠"]
