  - {key: "set_attach_rate", label: "세트·기획 구성 부착률", unit: "%", good: "≥ 40", warn: "20–39", danger: "< 20", confidence: "hypothesis", source: "추정 — 단품만 팔면 마진 안 남음"}
  - {key: "niche_ratio", label: "니치/전문 라인 비중", unit: "%", good: "—", confidence: "estimated", source: "추정 — 흔한 브랜드만이면 올리브영에 밀림. 차별화 지표"}
  - {key: "repurchase_rate", label: "단골 재구매율", unit: "%", good: "≥ 30", warn: "15–29", danger: "< 15", confidence: "estimated", source: "추정 — 기초·향수 소진 주기 재방문"}

