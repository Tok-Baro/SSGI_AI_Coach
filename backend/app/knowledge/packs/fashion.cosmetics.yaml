prompt_block: |-
  ## 업종 분기 가이드 — 화장품·향수·뷰티 편집샵 소매
  ※ 개인 화장품 가게는 올리브영·다이소·온라인에 밀려 어려운 구조 — 가격 경쟁이 아니라 체험·전문 상담·니치(니치향수·비건·전문 라인)로 차별화해야 살아남습니다. 그 전제로 답하세요.
  - Hero KPI: ① **객단가(세트·기획 구성 부착률 — 단품만 팔면 마진이 안 남) + 단골 재구매(소진 주기 재방문 — 기초·향수)** ② 체험·테스터·상담 전환율 ③ 니치/전문 라인 비중(차별화 — 흔한 브랜드만이면 올리브영에 짐) ④ 인스타·후기 노출
  - 객단가: 1~5만(세트·향수는 더 큼). 마진: 브랜드 직영 로드샵은 낮고(본사 정가), 편집샵·니치향수·전문 라인은 높음. (추정)
  - 운영 리듬: 발렌타인·화이트데이·어버이날·연말(선물·기획세트 시즌)·환절기(기초 교체) / 신상 출시·SNS 화제 제품 회전
  - Top 채널: ① **인스타그램(신상·기획세트·발색샷·향 묘사 — 비주얼 + 체험 콘텐츠) + 네이버 플레이스(검색·후기)** ② 카카오 친구톡(소진 주기·신상·세트 알림) ③ 체험단·뷰티 인플루언서(니치 제품 한정) ④ 당근(동네). 배달앱 무관. 가격 정보는 정확히(본사 정책·다이소 비교 노출 주의)
  - 손실 프레임: "체험·테스터·상담 동선 없음(온라인이랑 차별 없음)", "세트·기획 구성 미운영(단품만 — 마진 안 남음)", "니치/전문 라인 부재(흔한 브랜드만 — 올리브영에 짐)", "단골 소진 주기·신상 알림 채널 없음", "인스타 발색샷·향 콘텐츠 빈약"
  - 위험 신호: 객단가 < 2만(단품 위주) / 세트·기획 비중 낮음 / 니치/전문 라인 비중 낮음 / 재구매율 낮음
  - 카피 예: "올리브영에 없는 니치 향수·전문 라인 하나라도 갖추고, 시향·체험 동선을 만드세요 — 그게 우리만의 이유가 됩니다", "기초 화장품 단골은 2~3개월 주기로 떨어져요 — 그 시점에 '신상 + 세트 할인' 카톡을 보내세요"
  - 금지: "가격으로 올리브영·다이소와 경쟁"(질 수밖에 없음 — 체험·니치로), "배민 입점", 효과 과장 단정(화장품 광고 규제 — '효과·치료' 표현 주의)

hero_kpis:
