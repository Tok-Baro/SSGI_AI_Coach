# retail.cvs — 편의점 (체인 편의점)
# 핵심: 입지가 절대적 / 본사 시스템(발주·PB·행사·멤버십) 종속 / 24시간 인건비·로열티가 손익 누름 / 간편식·도시락 매출 비중↑.
# 출처: 편의점 업계 통상치(일 매출 ~180만+, 마진율 25~30%) + KB 자영업 보고서 + sme-coach. (가맹점 단위 통계는 본사 정보공개서 참고 — 추정 표기.)
id: retail.cvs
name: 편의점 (체인)
group: retail
status: active
version: 1
reviewed_date: 2026-05-11
sources:
  - label: 편의점 업계 통상치 + 공정위 가맹사업 정보공개서 + KB 자영업 분석 보고서 + sme-coach 플레이북
    year: 2024

match:
  priority: 44   # retail(60) 보다 먼저
  keywords: [편의점, CU, GS25, 세븐일레븐, 이마트24, 미니스톱, 씨유, 지에스25, 24시편의점, 무인편의점, 편의점가맹]
  ksic_codes: ["47122"]   # 체인화 편의점

prompt_block: |-
  ## 업종 분기 가이드 — 편의점 (체인 가맹)
  - Hero KPI: ① **일 매출·평당 매출(입지가 절대적 — 점주가 바꿀 수 있는 게 적음)** ② 매출총이익률(마진 25~30%, 상품원가 70~75% — 행사·PB 활용으로 개선) ③ 인건비 비율(24시간 알바 — 점주 근무시간으로 조절) ④ 폐기율(간편식·신선) ⑤ 본사 멤버십·앱 활용도(고정 단골)
  - 매출/객단가: 일 매출 ~180만+(월 4,000~6,000만, 입지 따라 편차 큼). 점주 순수익 월 ~400만 안팎(가맹형태·입지 의존). 인건비 비율 ~16%(24시간 운영 시) (추정)
  - 운영 리듬: 18~21시 퇴근 피크 + 점심·심야 / 금·토 +30% / 여름 음료·아이스 / 겨울 차·호빵·난방용품 / 계절·날씨·행사(1+1, 2+1) 민감 / 간편식·도시락 매출 비중 지속 증가
  - Top 채널: ① **본사 시스템(멤버십 앱·발주 추천·PB·행사 — 가장 중요. 본사 마케팅을 적극 활용)** ② 매대 진열(입구 30cm 황금 구역·계산대 옆 충동구매) ③ 카카오 단골방/문자(동네 단골 — 행사·신상 알림) ④ 네이버 플레이스·카카오맵(위치 검색). 인스타·블로그·배달앱(편의점 배달은 본사 제휴) 효과 제한적
  - 손실 프레임: "본사 행사·PB·발주 추천 미활용(마진 개선 기회 놓침)", "입구 30cm·계산대 옆 충동구매 구역 미활용", "간편식·도시락 라인업·진열 방치(매출 비중 큰데)", "동네 단골 알림 채널 없음", "폐기율 관리 안 됨(발주 패턴 점검 필요)"
  - 위험 신호: 일 매출 < 130만 / 마진율 < 22% / 인건비 비율 > 18% / 폐기율 > 5% / 본사 멤버십 활용 저조
  - 카피 예: "본사 행사·PB·발주 추천을 한 번 점검하세요 — 같은 매출이어도 마진을 2~3%p 끌어올릴 수 있어요. 그게 알바 한 명 줄이는 것만큼 큽니다", "입구 30cm와 계산대 옆에 회전 빠른·충동구매 상품을 두세요 — 그 구역이 매출의 큰 몫이에요"
  - 금지: "인스타 사진 톤 통일에 투자"(편의점은 SNS 효과 낮음), "독자 브랜딩"(본사 가맹 — 본사 시스템 활용이 우선), 본사 정책상 불가능한 가격·메뉴 조정 권하기

hero_kpis:
  - {key: "daily_sales", label: "일 매출", unit: "원", good: "≥ 1,800,000", warn: "1,300,000–1,799,999", danger: "< 1,300,000", confidence: "estimated", source: "업계 — 편의점 월 4,000~6,000만원"}
  - {key: "gross_margin", label: "매출총이익률(마진)", unit: "%", good: "25–30", warn: "22–24", danger: "< 22", confidence: "estimated", source: "업계 — 상품원가 70~75%"}
  - {key: "labor_cost_ratio", label: "인건비 비율", unit: "% 매출", good: "≤ 12", warn: "13–18", danger: "> 18", confidence: "estimated", source: "추정 — 24시간 운영 시 ~16%"}
  - {key: "waste_ratio", label: "폐기율(간편식·신선)", unit: "%", good: "≤ 3", warn: "4–5", danger: "> 5", confidence: "estimated", source: "업계 통설"}

kpi_thresholds:
  일_매출_위험: "< 1,300,000원"
  마진율_위험: "< 22%"
  인건비_비율_위험: "> 18%"
  폐기율_위험: "> 5%"

risk_signal_weights:   # 입지가 거의 전부 → 유동인구·배후거주 비중↑ / 본사 종속이라 경쟁 포지셔닝 영향 작음
  population_trend: 1.2
  competition: 0.9

subsidy_tags: [digital, store_renovation, rent_utility]   # 무인 키오스크·POS / 점포환경개선 / 전기·공공요금 감면 (24시간 전기료)

channels:
  - {key: "hq_system", name: "본사 시스템(멤버십 앱·PB·행사·발주 추천)", fit: "high", primary_metric: "마진·단골·재고 효율", roi_note: "편의점은 본사 마케팅·시스템 활용이 핵심 채널 — 멤버십 적립, 1+1·2+1 행사, PB 상품, 발주 추천 적극 활용", confidence: "hypothesis"}
  - {key: "shelf_layout", name: "매대 진열(입구 30cm·계산대 옆 충동구매)", fit: "high", primary_metric: "충동구매·평당 매출", roi_note: "입구 30cm가 매출의 큰 몫. 계산대 옆 소액·충동구매 상품 배치", confidence: "hypothesis"}
  - {key: "kakao_sms", name: "카카오 단골방·문자(동네 단골 — 행사·신상 알림)", fit: "medium", per_unit_cost_won: 10, primary_metric: "재방문", roi_note: "SMS ~10원·카카오 채널 텍스트 15원. 행사·신상 알림", confidence: "measured", source: "카카오 비즈메시지·SMS 단가"}
  - {key: "naver_kakaomap", name: "네이버 플레이스·카카오맵(위치 검색)", fit: "medium", entry_cost_won: 0, primary_metric: "위치 검색·길찾기", roi_note: "무료 등록", confidence: "measured", source: "네이버·카카오"}
  - {key: "delivery_app", name: "편의점 배달(본사 제휴 — 배민·요기요)", fit: "low", primary_metric: "배달 주문", roi_note: "본사 제휴 채널 — 점주 재량 적음. 야간·우천 시 보조 매출", confidence: "hypothesis"}
  - {key: "instagram_musinsa", name: "인스타그램·무신사 등", fit: "avoid", primary_metric: "—", roi_note: "편의점은 SNS·패션 채널 효과 낮음 — 비추천", confidence: "hypothesis"}

copy_tone:
  vocab: ["일 매출", "마진율", "본사 행사·PB", "입구 30cm 황금구역", "간편식·도시락"]
  loss_frames: ["본사 행사·PB·발주 추천 미활용", "입구 30cm·계산대 옆 충동구매 구역 미활용", "간편식·도시락 라인업·진열 방치", "동네 단골 알림 채널 없음", "폐기율 관리 안 됨"]
  examples:
    - "본사 행사·PB·발주 추천을 한 번 점검하세요 — 같은 매출이어도 마진을 2~3%p 끌어올릴 수 있어요. 그게 알바 한 명 줄이는 것만큼 큽니다"
    - "입구 30cm와 계산대 옆에 회전 빠른·충동구매 상품을 두세요 — 그 구역이 매출의 큰 몫이에요"
  do: ["본사 행사·PB·발주 추천 적극 활용(마진 개선)", "입구 30cm·계산대 옆 충동구매 구역 최적화", "간편식·도시락 라인업·진열 강화"]
  dont: ["인스타 사진 톤 통일에 투자 (편의점은 SNS 효과 낮음)", "독자 브랜딩·본사 정책 위반 가격/메뉴 조정 권하기"]
