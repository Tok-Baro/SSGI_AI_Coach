    - "족발에 막국수·쟁반국수·콜라를 세트로 묶으면 객단가가 5천원 더 올라갑니다"
  do: ["배달앱 운영시간·광고를 22~02시에 집중", "족발+막국수/음료 세트 구성으로 객단가↑", "배달앱 리뷰이벤트 + 공공배달앱 병행", "원룸·오피스텔 밀집지 전단"]
