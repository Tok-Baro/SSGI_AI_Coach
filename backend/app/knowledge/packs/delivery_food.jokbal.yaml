  vocab: ["심야 22~02시", "야식 단골", "세트 부착률", "토요일 폭증", "공공배달앱"]
  loss_frames: ["심야 시간대 배달앱 노출·운영 미흡", "족발+막국수/음료 세트 부착률 저조", "배달앱 별점·리뷰 관리 안 됨", "원룸·오피스텔 밀집지 타게팅 무대응"]
  examples:
