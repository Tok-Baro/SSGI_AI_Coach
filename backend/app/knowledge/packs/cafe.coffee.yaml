  vocab: ["단골 락인", "스탬프 적립", "테이블 회전", "아이스음료", "일 판매잔수"]
  loss_frames: ["네이버 플레이스 미정비(검색 누락)", "스탬프·멤버십 없어 단골 락인 부재", "(좌석형) 카공족 장기 점유로 회전 손실", "여름·겨울 시즌 라인업 무대응"]
  examples:
