# cafe.coffee — 커피전문점 (테이크아웃·좌석형 — 저가커피 vs 스페셜티·좌석형)
# 출처: 한국신용데이터 캐시노트(카페 평균 객단가 ~4,550원, 2025 추정) + 가맹사업 정보공개서(저가커피) + KB 자영업 보고서 + sme-coach.
