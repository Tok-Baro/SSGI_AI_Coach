# academy.exam — 입시·교과 학원 (보습/단과/종합 — 초중고 국영수, 재수)
# group=academy 상속 → channels/data_caveats/가중치 일부 상속, 특성 다른 것만 override.
# 출처: 통계청 초중고 사교육비조사 2024(영어 26.4만/수학 24.9만 — 참여학생) + 대형 입시업체 재무(메가스터디교육 등) + sme-coach.
id: academy.exam
name: 입시·교과 학원
group: academy
status: active
version: 1
reviewed_date: 2026-05-11
sources:
  - label: 통계청 2024 초중고 사교육비조사 + 대형 입시업체 재무공시(메가스터디교육 등) + sme-coach 플레이북
    year: 2024

match:
  priority: 15   # academy(45)·service(50)·restaurant(30 — "회" 같은 1글자 키워드 오탐) 보다 먼저 검사
  keywords: [입시학원, 보습학원, 입시보습, 단과학원, 종합학원, 재수학원, 재수종합, 입시컨설팅, 논술학원, 보습, 입시학원]
  ksic_codes: ["85501"]   # 일반 교과 학원

prompt_block: |-
  ## 업종 분기 가이드 — 입시·교과 학원 (보습/단과/종합)
  - Hero KPI: 합격 실적·입소문(레퍼럴) > 재등록률(학년 진급 시 잔류) > 정원 충족률 > 간판 학생(상위권) 보유
  - 객단가: 단과 1과목 15~30만, 종합·재수종합 50~150만+ (강남·목동 학원가 상단, 비수도권의 2~5배). 통계청 영어 26.4만·수학 24.9만(참여학생, 2024)이 동네 보습 기준선
  - 운영 리듬: 3월 신학기(최대 유입) > 12~2월 겨울방학 결제 폭증 > 7~8월 여름방학 > 11월 수능 후 고3 이탈·신고3 재편성
  - Top 채널: 맘카페·지역 학부모 커뮤니티(입소문) > 학원가 전단·우편함 DM·현수막(합격 플래카드) > 네이버 플레이스/블로그(설명회·체험수업 후기). 입시는 신뢰재라 SNS 영상보다 실적·후기 중심
  - 손실 프레임: "재등록 시즌(학년 진급) 이탈", "합격 실적 노출 부재", "정원 미달 빈 시간대", "설명회·체험수업 미운영"
  - 위험 신호: 재등록률 < 60% / 정원 충족률 < 50% / 강사료 비율 > 50%(스타강사 의존) / 영업이익률 < 6%
  - 카피 예: "재등록 안내를 학년 진급 한 달 전에 돌리세요. 그때 안 잡으면 옆 학원으로 갑니다", "합격 실적 플래카드 하나가 전단 1만 장보다 효과 큽니다"
  - 금지: "인스타 영상 마케팅에 집중하세요"(입시는 입소문·실적이 우선), "배달앱·무신사" 같은 무관 채널

hero_kpis:
  - {key: "reenroll_rate", label: "재등록률(학년 진급 시 잔류)", unit: "%", good: "≥ 80", warn: "60–79", danger: "< 60", confidence: "estimated", source: "업계 통설"}
  - {key: "capacity_fill", label: "정원 충족률", unit: "%", good: "≥ 70", warn: "50–69", danger: "< 50", confidence: "estimated", source: "추정"}
  - {key: "monthly_tuition", label: "학생 1인당 월 수강료", unit: "원", good: "—", warn: "—", danger: "—", confidence: "estimated", source: "통계청 사교육비조사 2024(영어 26.4만/수학 24.9만, 참여학생) — 종합·재수는 50만+"}
  - {key: "instructor_cost_ratio", label: "강사료 비율", unit: "% 매출", good: "≤ 45", warn: "46–55", danger: "> 55", confidence: "estimated", source: "업계 통설 — 스타강사 의존 시 더 높음"}
  - {key: "operating_margin", label: "영업이익률", unit: "%", good: "≥ 12", warn: "6–11", danger: "< 6", confidence: "estimated", source: "대형 입시업체 9.8~16.2%(2023~24) — 소형 보습은 정원 의존"}

kpi_thresholds:
  재등록률_위험: "< 60%"
  정원_충족률_위험: "< 50%"
  강사료_비율_위험: "> 55%"
  영업이익률_위험: "< 6%"

risk_signal_weights:   # 학군 내 입시학원 경쟁 극심 / 시즌(신학기·수능) 의존 큼
  competition: 1.3
  population_trend: 0.7

subsidy_tags: [education, store_renovation]   # 교육서비스 일반 + 점포환경개선 (교육청 직접 보조금은 거의 없음)

copy_tone:
  vocab: ["재등록", "정원", "학부모", "신학기", "합격 실적", "설명회", "맘카페"]
  loss_frames: ["재등록 시즌(학년 진급) 이탈", "합격 실적 노출 부재", "정원 미달 빈 시간대"]
  examples:
    - "재등록 안내를 학년 진급 한 달 전에 돌리세요. 그때 안 잡으면 옆 학원으로 갑니다"
    - "합격 실적 플래카드 하나가 전단 1만 장보다 효과 큽니다 — 동네에 보이게 거세요"
  do: ["맘카페·지역 학부모 커뮤니티에서 후기 관리", "학원가 우편함 DM·합격 현수막", "정기 설명회·체험수업으로 신규 전환"]
  dont: ["인스타 영상 마케팅에 올인 (입시는 입소문·실적 우선)", "객단가 단정 (학년·과목·지역 편차 2~5배)"]
