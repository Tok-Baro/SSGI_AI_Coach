prompt_block: |-
  ## 업종 분기 가이드 — 코딩·로봇·SW 교육 학원
  - Hero KPI: 트렌드 민감도(AI·로봇 등 커리큘럼 최신성) + 산출물(프로젝트·로봇 결과물·대회 입상) + 재등록률 + 체험수업 전환율 + 정부 사업 수주 여부
  - 객단가: 주1회 8~15만, 주2회 15~30만 (로봇·메이커는 교구비 별도). 성인 부트캠프는 국비(KDT) 모델로 수강생 무료
  - 운영 리듬: 방학(겨울·여름) 특강·캠프가 매출 핵심 + 정부 프로그램(디지털새싹 등) 운영 시기에 무료 수강 유입 → 유료 전환 시즌. 신학기 효과는 교과학원보다 약함
  - Top 채널: 맘카페·지역카페(학부모 정보 탐색) + 인스타그램(아이 코딩 결과물·로봇 영상은 시각적으로 잘 먹힘) > 네이버 플레이스/블로그(체험수업) > 전단. 정부 사업 운영 자체가 무료 체험 유입 채널
  - 손실 프레임: "정부 디지털교육 지원사업 미신청(자격 되는데도)", "방학 특강 캠프 미운영", "아이 작품·로봇 영상 콘텐츠 부재", "커리큘럼 노후(AI 미반영)"
  - 위험 신호: 재등록률 < 60% / 방학 특강 미운영 / 정부사업 0건(자격 충족 시) / 커리큘럼 2년 이상 미개편
  - 카피 예: "디지털새싹·SW미래채움 운영기관 공모 한 번 알아보세요 — 무료 체험으로 학생 30명 들어옵니다", "이번 방학 로봇 캠프 영상 1편만 인스타에 올려도 학부모 문의가 늘어요"
  - 금지: "배달앱·무신사" 같은 무관 채널, 정부지원 ROI 단정

