# restaurant.korean_meat — 한식 고기·구이 (삼겹살/갈비/곱창/숯불구이/무한리필).
#   group=restaurant 상속 → 프롬프트·임계값·timing/social_proof 가중치만 override.
#   (leaf 가 group 의 모든 필드를 상속하므로 다른 점만 적는다 — report_weights 는 합 1.0
#    제약 때문에 부분 override 금지, 그대로 상속.)
# 콘텐츠 출처: 한국외식산업연구원 외식업체 경영실태조사 + sme-coach 플레이북.
id: restaurant.korean_meat
name: 한식 고기·구이
group: restaurant
status: active
version: 1
reviewed_date: 2026-05-11
sources:
  - label: 한국외식산업연구원 외식업체 경영실태조사 + sme-coach 업종 플레이북
    year: 2026

match:
  priority: 25   # group restaurant(30) 보다 먼저 — "삼겹살집"·"고깃집" 이 여기로
  keywords: [삼겹살, 고깃집, 갈비, 곱창, 막창, 숯불, 구이전문, 무한리필, 정육식당, 우대갈비, 양념갈비, 한우]
  ksic_codes: ["56113"]   # 한식 육류요리 전문점

prompt_block: |-
  ## 업종 분기 가이드 — 한식 고기·구이 (삼겹살/갈비/곱창)
  - Hero KPI: 테이블 단가(2만~5만원, 한식 일반보다 높음) + 저녁/주말 매출 + 회전율(1.2~1.5회, 낮음)
  - Top 채널: 네이버 플레이스(필수) > 캐치테이블·네이버 예약(단체·회식) > 카카오맵 > 인스타(불판·고기 비주얼)
  - 운영 리듬: 17~22시 저녁 집중, 금/토 강세, 회식 시즌 12월 +40%
  - 손실 프레임: "회식 단체예약 미수신", "주말 저녁 노쇼·공석", "무한리필 경쟁점에 단가 잠식"
  - 위험 신호: 테이블 단가 < 1.8만원 / 회전율 < 1.2회 / 단체예약 비율 < 20% / 반경 내 무한리필 밀집
  - 카피 예: "회식 시즌 12월엔 매출이 평소보다 40% 올라요. 단체예약 페이지부터 만들어 두세요"
  - 금지: "점심 회전율 올리세요" (저녁 장사 위주엔 무관), "배달 비중 늘리세요" (구이류는 배달 적합도 낮음)

audit_weights:
  timing: 1.2        # 저녁·금토 피크 의존
  social_proof: 1.1  # 회식 후기·예약 평점

kpi_thresholds:
  테이블_단가_위험: "< 18,000원"
  회전율_위험: "< 1.2회"
  단체예약_비율_위험: "< 20%"

# hero_kpis 는 group(restaurant)의 "점심 회전율" 대신 고기·구이 특성으로 재정의 (channels/copy_tone 은 상속).
hero_kpis:
  - {key: "table_ticket", label: "테이블 단가", unit: "원", good: "≥ 30,000", warn: "18,000–29,999", danger: "< 18,000", confidence: "estimated", source: "추정 — 한식 일반보다 높음"}
  - {key: "turnover", label: "회전율", unit: "회", good: "≥ 1.5", warn: "1.2–1.4", danger: "< 1.2", confidence: "estimated", source: "업계 추정 — 저녁 위주, 한식 일반보다 낮음"}
  - {key: "group_reservation_ratio", label: "단체예약 비율", unit: "%", good: "≥ 20", danger: "< 20", confidence: "estimated", source: "업계 추정 — 회식 시즌 12월 +40%"}
  - {key: "operating_margin", label: "영업이익률", unit: "%", good: "≥ 10", warn: "5–9", danger: "< 5", confidence: "estimated", source: "외식업체 평균 8.7% (2024, 농식품부)"}
